<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crewboard — Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=IBM+Plex+Sans:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js"></script>
<style>
:root{
  --paper:#f5f1ea;--paper-2:#ebe5d9;--paper-3:#ddd5c4;
  --ink:#1a1614;--ink-2:#4a423b;--ink-3:#7a7068;
  --rule:#1a1614;--rule-soft:#c4b9a3;
  --accent:#dc4a2a;--accent-deep:#a93617;--accent-soft:#f4d4c8;
  --confirm:#0d4f3c;--confirm-soft:#c8dcd2;
  --warn:#b8860b;--warn-soft:#f0e3b8;
  --arvo:#1a3a6b;--arvo-soft:#d0dff0;
  --shadow-1:0 1px 0 rgba(26,22,20,.08);
  --shadow-2:0 2px 16px rgba(26,22,20,.08);
}
select option{background-color:#ffffff;color:#1a1614;} .lvcal{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--rule-soft);border:1px solid var(--rule-soft);margin-top:8px}.lvcal-day{background:var(--paper);min-height:90px;padding:8px;display:flex;flex-direction:column}.lvcal-day.today{background:var(--confirm-soft)}.lvcal-dname{font-family:'IBM Plex Mono',monospace;font-size:9px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3)}.lvcal-dnum{font-family:'Instrument Serif',serif;font-size:20px;line-height:1;margin-bottom:6px}.lvcal-name{font-size:11px;padding:2px 5px;background:var(--accent-soft);color:var(--accent-deep);border-radius:3px;margin-bottom:3px;line-height:1.3}.lvcal-empty{font-size:10px;color:var(--rule-soft)}.lvcal-nav{display:flex;align-items:center;gap:10px;margin-bottom:4px}.lvcal-range{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--ink-2);min-width:200px}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--paper);color:var(--ink);font-family:'IBM Plex Sans',sans-serif;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
body{min-height:100vh;background-image:radial-gradient(circle at 1px 1px,rgba(26,22,20,.04) 1px,transparent 0);background-size:18px 18px}
button{font-family:inherit;font-size:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
.serif{font-family:'Instrument Serif',serif}
.mono{font-family:'IBM Plex Mono',monospace}
/* Top bar */
.topbar{position:sticky;top:0;z-index:50;background:var(--paper);border-bottom:1px solid var(--rule);padding:10px 28px;display:flex;align-items:center;justify-content:space-between;gap:24px}
.brand{display:flex;align-items:center;gap:12px}
.brand-logo{height:36px;width:auto;display:block}
.brand-divider{width:1px;height:28px;background:var(--rule-soft)}
.brand-text{display:flex;flex-direction:column}
.brand-name{font-family:'Instrument Serif',serif;font-size:22px;line-height:1;color:var(--ink)}
.brand-sub{font-family:'IBM Plex Mono',monospace;font-size:9px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.15em}
.topbar-meta{display:flex;align-items:center;gap:18px;font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink-2);text-transform:uppercase;letter-spacing:.1em}
/* Buttons */
.btn{display:inline-flex;align-items:center;gap:8px;padding:9px 16px;border:1px solid var(--ink);background:var(--paper);font-size:12px;font-weight:500;text-transform:uppercase;letter-spacing:.08em;transition:all .12s ease;white-space:nowrap}
.btn:hover{background:var(--ink);color:var(--paper)}
.btn-primary{background:var(--ink);color:var(--paper)}
.btn-primary:hover{background:var(--accent);border-color:var(--accent);color:#fff}
.btn-accent{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn-accent:hover{background:var(--accent-deep);border-color:var(--accent-deep)}
.btn-arvo{background:var(--arvo);color:#fff;border-color:var(--arvo)}
.btn-arvo:hover{background:#142d56;border-color:#142d56}
.btn-ghost{border-color:transparent}
.btn-ghost:hover{background:var(--paper-2);color:var(--ink)}
.btn-sm{padding:5px 10px;font-size:10px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn:disabled:hover{background:var(--paper);color:var(--ink)}
/* Inputs */
.input,.select,.textarea{width:100%;padding:10px 12px;background:#fff;border:1px solid var(--rule-soft);border-radius:0;font-size:13px;outline:none;transition:border-color .1s}
.input:focus,.select:focus,.textarea:focus{border-color:var(--ink)}
.label{display:block;font-family:'IBM Plex Mono',monospace;font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:var(--ink-2);margin-bottom:6px}
/* Layout */
.app{display:flex;min-height:calc(100vh - 57px)}
.sidebar{width:220px;border-right:1px solid var(--rule);padding:24px 0;background:var(--paper);flex-shrink:0}
.sidenav-section{padding:0 24px 12px;font-family:'IBM Plex Mono',monospace;font-size:10px;text-transform:uppercase;letter-spacing:.15em;color:var(--ink-3);margin-top:12px}
.sidenav-section:first-child{margin-top:0}
.sidenav-item{display:flex;align-items:center;gap:10px;padding:10px 24px;font-size:13px;border-left:3px solid transparent;transition:all .1s;text-align:left;width:100%}
.sidenav-item:hover{background:var(--paper-2)}
.sidenav-item.active{border-left-color:var(--accent);background:var(--paper-2);font-weight:500}
.sidenav-item .badge{margin-left:auto;background:var(--accent);color:#fff;font-family:'IBM Plex Mono',monospace;font-size:10px;padding:1px 6px}
.main{flex:1;padding:32px 40px;min-width:0;overflow-x:auto}
/* Page header */
.page-head{display:flex;align-items:flex-end;justify-content:space-between;padding-bottom:20px;border-bottom:1px solid var(--rule);margin-bottom:28px;gap:24px;flex-wrap:wrap}
.page-title{font-family:'Instrument Serif',serif;font-size:48px;line-height:1;letter-spacing:-.01em}
.page-eyebrow{font-family:'IBM Plex Mono',monospace;font-size:10px;text-transform:uppercase;letter-spacing:.15em;color:var(--ink-3);margin-bottom:6px}
.page-actions{display:flex;gap:8px;flex-wrap:wrap}
/* Cards */
.card{background:var(--paper);border:1px solid var(--rule);padding:20px}
.card-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;padding-bottom:10px;border-bottom:1px solid var(--rule-soft)}
.card-title{font-family:'Instrument Serif',serif;font-size:22px;line-height:1}
/* Tables */
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-family:'IBM Plex Mono',monospace;font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:var(--ink-2);padding:10px 12px;border-bottom:1px solid var(--rule);font-weight:500;background:var(--paper-2)}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--rule-soft);vertical-align:top}
.tbl tr:hover td{background:var(--paper-2)}
/* Roster grid */
.roster{border:1px solid var(--rule);background:var(--paper);overflow:auto}
.roster-table{display:grid;grid-template-columns:200px repeat(5,minmax(180px,1fr));min-width:1200px}
.r-cell{border-right:1px solid var(--rule-soft);border-bottom:1px solid var(--rule-soft);padding:12px;background:var(--paper)}
.r-cell:nth-child(6n){border-right:none}
.r-day{background:var(--ink);color:var(--paper);position:sticky;top:0;z-index:5;font-family:'IBM Plex Mono',monospace;text-transform:uppercase;letter-spacing:.1em;padding:10px 12px;font-size:11px}
.r-day.arvo-day{background:var(--arvo)}
.r-day .day-num{font-family:'Instrument Serif',serif;font-size:24px;line-height:1;text-transform:none;letter-spacing:0;color:var(--paper)}
.r-day .day-date{color:rgba(245,241,234,.6);font-size:10px;margin-top:2px;display:block}
.r-line-head{background:var(--paper-2);font-weight:600;font-size:13px;border-right:1px solid var(--rule);position:sticky;left:0;z-index:4;display:flex;flex-direction:column;justify-content:space-between}
.r-line-name{font-family:'Instrument Serif',serif;font-size:24px;line-height:1.1}
.r-line-meta{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.1em;margin-top:4px}
.cat-badges{display:flex;gap:4px;margin-top:6px;margin-bottom:auto;flex-wrap:wrap}
.cat-badge{display:inline-flex;align-items:center;gap:3px;font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:600;padding:2px 6px;border-radius:5px;border:1px solid rgba(26,22,20,.12);line-height:1}
.cat-ft{background:#d9f2d9;color:#1f6b1f}
.cat-cc{background:#fdf3cf;color:#8a6d12}
.cat-ac{background:#fbdcdc;color:#a52a2a}
.shift.ac-clayton{background:#6b21a8;border-color:#4c1580}
.shift.ac-clayton .shift-worker,.shift.ac-clayton .shift-role span,.shift.ac-clayton .shift-role,.shift.ac-clayton .shift-time{color:#fff}
.shift.ac-apg{background:#c1121f;border-color:#8f0d17}
.shift.ac-apg .shift-worker,.shift.ac-apg .shift-role span,.shift.ac-apg .shift-role,.shift.ac-apg .shift-time{color:#fff}
.cat-clayton{background:#ede0f7;color:#6b21a8}
.cat-apg{background:#fbd6d9;color:#c1121f}
.cat-total-bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:14px;padding:12px 16px;border:1px solid var(--rule-soft);border-radius:10px;background:var(--paper-2)}
.cat-total-label{font-family:'IBM Plex Mono',monospace;font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--ink-3);margin-right:4px}
.cat-total-badge{display:inline-flex;align-items:center;gap:5px;font-family:'IBM Plex Mono',monospace;font-size:13px;font-weight:600;padding:5px 10px;border-radius:7px;border:1px solid rgba(26,22,20,.12)}
.r-line-prod{font-size:11px;color:var(--ink-2);margin-top:8px;font-style:italic}
/* Shift cards - BIGGER for factory floor readability */
.shift{border:1px solid var(--rule-soft);background:#fff;padding:4px 8px;margin-bottom:3px;font-size:12px;cursor:pointer;transition:all .1s;position:relative;text-align:left;width:100%;display:block}
.shift:last-child{margin-bottom:0}
.shift:hover{border-color:var(--ink);box-shadow:var(--shadow-1)}
.shift-leader{background:#ffe14d;border-color:#d4a800}
.shift-leader:hover{border-color:#c79a00;box-shadow:var(--shadow-1)}
.shift-leader .shift-role{color:#7a5c00}
.shift-role{font-weight:600;font-size:10px;text-transform:uppercase;letter-spacing:.03em;display:flex;justify-content:space-between;align-items:baseline;gap:6px;color:var(--ink-2)}
.shift-worker{font-size:13px;font-weight:600;color:var(--ink);margin-top:0;line-height:1.15}
.shift-worker.empty{color:var(--ink-3);font-style:italic;font-weight:400;font-size:12px}
.shift-time{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--ink-2);margin-top:0;letter-spacing:.02em}
.shift.conflict{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}
.shift.understaffed{border-color:#9a9a9a;background:#c4c4c4}
.shift.arvo-shift{border-left:3px solid var(--arvo)}
.shift-flag{font-family:'IBM Plex Mono',monospace;font-size:9px;text-transform:uppercase;letter-spacing:.1em;background:var(--accent);color:#fff;padding:1px 5px;display:inline-block;position:absolute;top:-1px;right:-1px}
/* Shift type tabs */
.shift-type-tabs{display:flex;gap:0;margin-bottom:16px;border:1px solid var(--rule)}
.stt{flex:1;padding:10px 16px;font-family:'IBM Plex Mono',monospace;font-size:11px;text-transform:uppercase;letter-spacing:.1em;text-align:center;border:none;background:var(--paper);color:var(--ink-3);cursor:pointer;transition:all .12s}
.stt.active{background:var(--ink);color:var(--paper);font-weight:500}
.stt.arvo-active{background:var(--arvo);color:#fff;font-weight:500}
.stt:hover:not(.active):not(.arvo-active){background:var(--paper-2)}
.line-add{width:100%;padding:6px;font-size:11px;border:1px dashed var(--rule-soft);background:transparent;color:var(--ink-3);text-align:center;font-family:'IBM Plex Mono',monospace;text-transform:uppercase;letter-spacing:.1em}
.line-add:hover{border-color:var(--ink);color:var(--ink);background:var(--paper-2)}
/* Modal */
.modal-overlay{position:fixed;inset:0;z-index:9999;background:rgba(26,22,20,.5);display:flex;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(2px)}
.modal{background:var(--paper);border:1px solid var(--ink);width:100%;max-width:520px;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal-head{padding:20px 24px;border-bottom:1px solid var(--rule);display:flex;align-items:center;justify-content:space-between}
.modal-title{font-family:'Instrument Serif',serif;font-size:28px;line-height:1}
.modal-body{padding:24px}
.modal-foot{padding:16px 24px;border-top:1px solid var(--rule);display:flex;justify-content:space-between;gap:8px;align-items:center}
/* Drag and drop */
.shift[draggable=true]{cursor:grab}
.shift[draggable=true]:active{cursor:grabbing}
.shift.is-dragging{opacity:.35;border-style:dashed;transform:scale(.97)}
.shift.drag-over{border-color:var(--accent)!important;background:var(--accent-soft)!important;transform:scale(1.03);box-shadow:0 0 0 2px var(--accent)}
.r-cell.drag-target{background:rgba(220,74,42,.05);outline:2px dashed var(--accent);outline-offset:-4px}
.drag-ghost{position:fixed;top:-9999px;left:-9999px;background:var(--ink);color:var(--paper);padding:6px 12px;font-size:12px;font-family:'IBM Plex Sans',sans-serif;font-weight:500;white-space:nowrap;pointer-events:none;z-index:10000}
.drop-hint{text-align:center;padding:8px;border:2px dashed var(--accent);background:var(--accent-soft);font-family:'IBM Plex Mono',monospace;font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--accent);margin-bottom:4px}
/* Alerts */
.alert{border:1px solid var(--accent);background:var(--accent-soft);padding:12px 16px;font-size:13px;display:flex;align-items:flex-start;gap:10px;margin-bottom:16px}
.alert .alert-mark{font-family:'IBM Plex Mono',monospace;background:var(--accent);color:#fff;width:22px;height:22px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;flex-shrink:0}
.alert.confirm{border-color:var(--confirm);background:var(--confirm-soft)}
.alert.confirm .alert-mark{background:var(--confirm)}
.alert.warn{border-color:var(--warn);background:var(--warn-soft)}
.alert.warn .alert-mark{background:var(--warn)}
/* Stats */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:1px;background:var(--rule);border:1px solid var(--rule);margin-bottom:24px}
.stat{background:var(--paper);padding:18px 20px}
.stat-eyebrow{font-family:'IBM Plex Mono',monospace;font-size:9px;text-transform:uppercase;letter-spacing:.15em;color:var(--ink-3);margin-bottom:6px}
.stat-num{font-family:'Instrument Serif',serif;font-size:42px;line-height:1}
.stat-meta{font-size:11px;color:var(--ink-2);margin-top:4px}
/* Pills */
.pill{display:inline-block;padding:2px 8px;font-family:'IBM Plex Mono',monospace;font-size:10px;text-transform:uppercase;letter-spacing:.1em;border:1px solid var(--ink)}
.pill.draft{border-color:var(--warn);color:var(--warn);background:var(--warn-soft)}
.pill.published{border-color:var(--confirm);color:var(--confirm);background:var(--confirm-soft)}
.pill.accent{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.skill-chip{display:inline-block;border:1px solid var(--rule-soft);background:var(--paper);padding:2px 8px;font-size:11px;margin:0 4px 4px 0;font-family:'IBM Plex Mono',monospace;letter-spacing:.04em}
/* Login */
.login-screen{min-height:100vh;display:grid;grid-template-columns:1fr 1fr}
.login-art{background:#1f3a5f;color:var(--paper);padding:40px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.login-art::before{content:"";position:absolute;inset:0;background-image:linear-gradient(135deg,rgba(176,30,46,.30) 0%,transparent 55%)}
.login-art-content{position:relative;z-index:1}
.login-logo{height:48px;width:auto;margin-bottom:32px}
.login-headline{font-family:'Instrument Serif',serif;font-size:64px;line-height:.95;letter-spacing:-.015em;margin-top:32px}
.login-headline em{font-style:italic;color:var(--accent)}
.login-tagline{font-family:'IBM Plex Mono',monospace;font-size:11px;text-transform:uppercase;letter-spacing:.18em;opacity:.6;margin-top:24px;max-width:380px;line-height:1.6}
.login-foot{font-family:'IBM Plex Mono',monospace;font-size:10px;text-transform:uppercase;letter-spacing:.15em;opacity:.4;position:relative;z-index:1}
.login-form-wrap{padding:60px 80px;display:flex;flex-direction:column;justify-content:center;background:var(--paper)}
.login-form{max-width:360px;width:100%}
.login-eyebrow{font-family:'IBM Plex Mono',monospace;font-size:11px;text-transform:uppercase;letter-spacing:.15em;color:var(--ink-2);margin-bottom:8px}
.login-title{font-family:'Instrument Serif',serif;font-size:42px;line-height:1;margin-bottom:32px}
.login-hint{margin-top:24px;padding:14px;border:1px dashed var(--rule-soft);font-size:11px;color:var(--ink-2);font-family:'IBM Plex Mono',monospace;line-height:1.6}
.login-hint b{color:var(--ink);font-weight:500}
/* Misc utilities */
.empty-state{padding:60px 20px;text-align:center;color:var(--ink-3);font-style:italic;font-family:'Instrument Serif',serif;font-size:20px}
.muted{color:var(--ink-3)}
.flex{display:flex}.gap-2{gap:8px}.gap-3{gap:12px}.gap-4{gap:16px}.items-center{align-items:center}.justify-between{justify-content:space-between}.flex-wrap{flex-wrap:wrap}.flex-1{flex:1}
.mb-2{margin-bottom:8px}.mb-3{margin-bottom:12px}.mb-4{margin-bottom:16px}.mb-6{margin-bottom:24px}
.mt-2{margin-top:8px}.mt-3{margin-top:12px}.mt-4{margin-top:16px}
.text-sm{font-size:12px}.text-xs{font-size:11px}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
/* Time-off cards */
.tof-card{border:1px solid var(--rule);background:var(--paper);padding:18px 20px;margin-bottom:10px;display:grid;grid-template-columns:90px 1fr auto;gap:18px;align-items:center}
.tof-card.approved{border-left:4px solid var(--confirm)}
.tof-date-block{display:flex;flex-direction:column;align-items:flex-start}
.tof-date-name{font-family:'IBM Plex Mono',monospace;font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:var(--ink-3)}
.tof-date-num{font-family:'Instrument Serif',serif;font-size:42px;line-height:1;letter-spacing:-.02em}
.tof-date-month{font-family:'IBM Plex Mono',monospace;font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:var(--ink-3)}
.tof-meta{font-family:'IBM Plex Mono',monospace;font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--ink-3)}
.tof-name{font-family:'Instrument Serif',serif;font-size:22px;line-height:1.1;margin-top:2px}
.tof-note{font-size:12px;color:var(--ink-2);margin-top:6px;font-style:italic}
.tof-actions{display:flex;gap:6px;align-items:center}
/* Notifications */
.notif{border-bottom:1px solid var(--rule-soft);padding:14px 0;display:flex;gap:12px}
.notif:first-child{padding-top:0}
.notif.unread{border-left:3px solid var(--accent);padding-left:12px;margin-left:-15px}
.notif-time{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.1em;white-space:nowrap}
.notif-body{flex:1;font-size:13px}
.notif-summary{margin-top:4px;color:var(--ink-2);font-size:12px}
/* ── PRINT LAYOUT ──────────────────────── */
.pv-controls{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:16px;padding:20px 0 24px;border-bottom:1px solid var(--rule);margin-bottom:28px}
.pv-week-nav{display:flex;align-items:center;gap:8px}
.pv-options{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.pv-sheet{background:#fff;border:1px solid var(--rule);padding:20px 28px;font-family:'IBM Plex Sans',sans-serif;margin-bottom:24px}
.pv-sheet+.pv-sheet{border-top:none}
.pv-header{display:flex;justify-content:space-between;align-items:flex-start;padding-bottom:12px;border-bottom:2px solid #1a1614;margin-bottom:14px}
.pv-header-left{display:flex;align-items:center;gap:16px}
.pv-logo{height:38px;width:auto}
.pv-title-block{}
.pv-title{font-family:'Instrument Serif',serif;font-size:24px;line-height:1;color:#1a1614}
.pv-subtitle{font-size:10px;color:#4a423b;margin-top:3px;font-family:'IBM Plex Mono',monospace;text-transform:uppercase;letter-spacing:.1em}
.pv-badge{display:inline-block;padding:2px 8px;font-family:'IBM Plex Mono',monospace;font-size:9px;text-transform:uppercase;letter-spacing:.1em;border:1px solid;margin-left:8px;vertical-align:middle}

      return (data||[]).map(n => ({ id:n.id, ts:new Date(n.created_at).getTime(), title:n.title, summary:n.summary, type:n.type, unread:n.unread, weekStart:n.week_start }));
    }
    return null;
  },
  async set(key, value) {
    if (key === 'currentUser') { Store._session = value; return true; } if (Store._session && Store._session.role !== 'manager') { console.warn('Read-only mode: write blocked for role ' + Store._session.role); return false; }
    if (key === '_seeded'||key==='roles'||key==='skuTemplates') return true;
    if (key === 'users'||key==='lines'||key==='products') return true;
    if (key === 'rdoRequests') return true;
    if (key.startsWith('notif:')) return true;
    if (key.startsWith('roster:')) {
      const { weekStart, status, publishedAt, version, changeLog, shifts } = value;
      const { data: roster, error: rErr } = await sb.from('rosters').upsert({
        week_start:weekStart, status, published_at: publishedAt ? new Date(publishedAt).toISOString() : null,
        version:version||0, change_log:changeLog||[], updated_at:new Date().toISOString(),
      },{ onConflict:'week_start' }).select().single();
      if (rErr||!roster) { console.error('[Crewboard] roster upsert:',rErr); return false; }
      if (shifts&&shifts.length>0) {
        const rows = shifts.map(s => ({
            id:s.id, roster_id:roster.id, day:s.day, line_id:s.lineId,
            product_id:s.productId, role:s.role, worker_id:s.workerId||null,
            start_time:s.startTime, end_time:s.endTime, std_count:s.stdCount||1,
            shift_type:s.shiftType||'day',
          }));
        const { error: sErr } = await sb.from('shifts').upsert(rows, {onConflict:'id'});
        if (sErr) { console.error('[Crewboard] shifts insert:',sErr); return false; }
        const keepIds = shifts.map(s=>s.id);
        await sb.from('shifts').delete().eq('roster_id',roster.id).not('id','in','('+keepIds.map(x=>'"'+x+'"').join(',')+')');
      } else {
        await sb.from('shifts').delete().eq('roster_id',roster.id);
      }
      return true;
    }
    return true;
  },
  async del(key) {
    if (key === 'currentUser') { Store._session = null; return true; }
    return true;
  },
};

function startOfWeek(date) {
  const d = new Date(date), day = d.getDay(), diff = day===0?-6:1-day;
  d.setDate(d.getDate()+diff); d.setHours(0,0,0,0); return d;
}
function isoWeekKey(date) { return startOfWeek(date).toISOString().slice(0,10); }
function addDays(d,n) { const c=new Date(d); c.setDate(c.getDate()+n); return c; }

function timeToDec(t) { if(!t) return null; const [h,m]=t.split(':').map(Number); return (h*60+m)/(24*60); }
function durationHours(s,e) {
  const [sh,sm]=s.split(':').map(Number),[eh,em]=e.split(':').map(Number);
  let mins=(eh*60+em)-(sh*60+sm); if(mins<0) mins+=24*60; return (mins/60).toFixed(1);
}
function uuid() {
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{
    const r=Math.random()*16|0; return (c==='x'?r:(r&0x3|0x8)).toString(16);
  });
}
function ymd(d) { return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function relativeTime(ts) {
  const diff=Date.now()-ts,m=Math.floor(diff/60000);
  if(m<1) return 'just now'; if(m<60) return `${m}m ago`;
  const h=Math.floor(m/60); if(h<24) return `${h}h ago`;
  return new Date(ts).toLocaleDateString();
}

function buildSampleRoster(weekStart, status='draft') {
  const shifts=[];
  const productByLineByDay={L1:['P01','P03','P02','P05','P01'],L2:['P10','P10','P10','P12','P10'],L4:['P14','P15','P16','P17','P14'],RMI:['PRMI','PRMI','PRMI','PRMI','PRMI'],KLK:['PKLK','PKLK','PKLK','PKLK','PKLK'],CLN:['PCLN','PCLN','PCLN','PCLN','PCLN'],PLT:['PPLT','PPLT','PPLT','PPLT','PPLT']};
  const workersByLine={};
  SEED_WORKERS.forEach(w=>{if(!workersByLine[w.primaryLine])workersByLine[w.primaryLine]=[];workersByLine[w.primaryLine].push(w);});
  for(let dayIdx=0;dayIdx<5;dayIdx++){
    Object.keys(SHIFT_TEMPLATES).forEach(lineId=>{
      const tmpl=SHIFT_TEMPLATES[lineId];
      const productId=productByLineByDay[lineId][dayIdx];
      const def=SHIFT_DEFAULTS[lineId];
      const lineWorkers=[...(workersByLine[lineId]||[])];
      tmpl.forEach(slot=>{
        for(let i=0;i<slot.count;i++){
          let worker=null;
          const idx=lineWorkers.findIndex(w=>w.skills.includes(slot.role));
          if(idx>=0){worker=lineWorkers[idx];lineWorkers.splice(idx,1);}
          shifts.push({id:uuid(),day:dayIdx,lineId,productId,role:slot.role,workerId:worker?worker.id:null,startTime:def.start,endTime:def.end,stdCount:slot.count,shiftType:'day'});
        }
      });
    });
  }
  return {weekStart:isoWeekKey(weekStart),status,shifts,publishedAt:status==='published'?Date.now():null,version:1,changeLog:[]};
}
/* ── RDO helpers ── */
async function listRdoRequests() {
  const { data } = await sb.from('rdo_requests').select('*').order('date',{ascending:true});
  return (data||[]).map(r=>({...r,workerId:r.worker_id,assignedBy:r.assigned_by,assignedAt:new Date(r.assigned_at).getTime()}));
}
async function assignRdo({workerId,date,type='RDO',note='',assignedBy=''}) {
  const {data:entry,error}=await sb.from('rdo_requests').upsert({worker_id:workerId,date,type,note,assigned_by:assignedBy,assigned_at:new Date().toISOString()},{onConflict:'worker_id,date'}).select().single();
  if(error){console.error('[Crewboard] assignRdo:',error);return null;}
  await sb.from('notifications').insert({worker_id:workerId,unread:true,type:'rdo',title:`Time off assigned — ${date}`,summary:`${type} recorded for ${date}${note?`: "${note}"`:''}.`});
  await sb.channel(`notify:${workerId}`).send({type:'broadcast',event:'new_notification',payload:{id:entry.id,ts:Date.now(),unread:true,type:'rdo',title:`Time off assigned — ${date}`,summary:`${type} recorded for ${date}${note?`: "${note}"`:''}.`}});
  return {...entry,workerId:entry.worker_id};
}
async function removeRdo(id) { await sb.from('rdo_requests').delete().eq('id',id); }
/* ── SaveStatus ── */
function SaveStatus({status}) {
  if(!status) return null;
  if(status.state==='saving') return <span className="text-xs muted" style={{display:'inline-flex',alignItems:'center',gap:6}}><span style={{width:6,height:6,borderRadius:'50%',background:'var(--warn)',display:'inline-block',animation:'pulse 1s ease-in-out infinite'}}></span>saving…</span>;
  if(status.state==='error') return <span className="text-xs" style={{color:'var(--accent)'}}>⚠ {status.error}</span>;
  if(status.state==='saved'&&status.at) return <span className="text-xs muted">✓ saved {relativeTime(status.at)}</span>;
  if(status.state==='idle'&&status.at) return <span className="text-xs muted">last saved {relativeTime(status.at)}</span>;
  return null;
}
/* ── Portal ── */
function Portal({children}) {
  const el=useRef(document.createElement('div'));
  useEffect(()=>{const node=el.current;document.body.appendChild(node);return()=>document.body.removeChild(node);},[]);
  return ReactDOM.createPortal(children,el.current);
}

            <div><div style={{fontSize:9,fontFamily:"'IBM Plex Mono',monospace",textTransform:'uppercase',letterSpacing:'.1em',color:'var(--ink-3)'}}>Position</div><div style={{marginTop:2,fontSize:13,fontWeight:500}}>{s.role}</div></div>
            <div><div style={{fontSize:9,fontFamily:"'IBM Plex Mono',monospace",textTransform:'uppercase',letterSpacing:'.1em',color:'var(--ink-3)'}}>Shift Type</div><div style={{marginTop:2,fontSize:13,fontWeight:500,color:isArvo?'var(--arvo)':'var(--confirm)'}}>{isArvo?'☾ Arvo':'☀ Day'}</div></div>
          </div>
          {mode==='new'&&(
            <div className="mb-4">
              <label className="label">Position / Role</label>
              <select className="select" value={s.role} onChange={e=>setS({...s,role:e.target.value})}>
                {ROLES.map(r=><option key={r} value={r}>{r}</option>)}
              </select>
            </div>

          <div className="mb-4">

        <div className="modal-foot">

            <button className={`btn ${isArvo?'btn-arvo':'btn-primary'}`} onClick={()=>onSave(s,mode==='new')}>{mode==='new'?'Add Shift':'Save Changes'}</button>
          </div>
        </div>
      </div>
    </div>
    </Portal>
  );
}

/* ── Manager Time Off ── */
function ManagerTimeOff() {
  const {user}=useAuth();

  const [users,setUsers]=useState([]);
  const [workerId,setWorkerId]=useState('');
  const [date,setDate]=useState('');
  const [endDate,setEndDate]=useState('');
  const [calWeek,setCalWeek]=useState(()=>{const d=new Date();const day=(d.getDay()+6)%7;return ymd(addDays(d,-day));});
  const [type,setType]=useState('RDO');
  const [note,setNote]=useState('');
  const [busy,setBusy]=useState(false);
  const [toast,setToast]=useState('');
  const [filterWorker,setFilterWorker]=useState('');
  const refresh=async()=>{const rdos=await listRdoRequests();const usrs=(await Store.get('users'))||[];setEntries(rdos);setUsers(usrs.filter(u=>u.role==='worker'));};
  useEffect(()=>{refresh();},[]);
  const assign=async(e)=>{e.preventDefault();if(!workerId||!date)return;const start=date;const finish=endDate&&endDate>=date?endDate:date;setBusy(true);let count=0;let cur=new Date(start+'T00:00:00');const last=new Date(finish+'T00:00:00');while(cur<=last){await assignRdo({workerId,date:ymd(cur),type,note,assignedBy:user.id});count++;cur=addDays(cur,1);}await refresh();setWorkerId('');setDate('');setEndDate('');setType('RDO');setNote('');setToast('Booked '+count+(count===1?' day':' days')+' off.');setTimeout(()=>setToast(''),2500);setBusy(false);};
  const remove=async(id)=>{if(!confirm('Remove this time-off entry?'))return;await removeRdo(id);await refresh();};
  const today=ymd(new Date());
  const findWorker=id=>users.find(u=>u.id===id);
  const visible=filterWorker?entries.filter(r=>r.workerId===filterWorker):entries;
  const sorted=[...visible].sort((a,b)=>b.date.localeCompare(a.date));
  return (
    <div className="fade-up">
      <div className="page-head"><div><div className="page-eyebrow">Workforce · Leave management</div><h1 className="page-title">Time Off</h1></div></div>

            <div><label className="label">Start date</label><input type="date" className="input mono" value={date} min={today} onChange={e=>{setDate(e.target.value); if(!endDate||endDate<e.target.value) setEndDate(e.target.value);}} required /></div><div><label className="label">End date</label><input type="date" className="input mono" value={endDate} min={date||today} onChange={e=>setEndDate(e.target.value)} required /></div>
          </div>
          <div className="grid-2 mb-4">
            <div><label className="label">Type</label><select className="select" value={type} onChange={e=>setType(e.target.value)}><option value="RDO">RDO</option><option value="Annual">Annual leave</option><option value="Personal">Personal leave</option><option value="Sick">Sick leave</option><option value="TOIL">TOIL</option></select></div>
            <div><label className="label">Note (optional)</label><input className="input" value={note} onChange={e=>setNote(e.target.value)} placeholder="e.g. pre-approved" /></div>

        <div className="page-eyebrow" style={{marginBottom:0}}>{sorted.length} entr{sorted.length===1?'y':'ies'}</div>

      </div>
      {sorted.length===0?<div className="empty-state">No time-off entries yet.</div>:sorted.map(r=>{
        const w=findWorker(r.workerId);const d=new Date(r.date+'T00:00:00');const assigner=users.find(u=>u.id===r.assignedBy);
        return (<div key={r.id} className="tof-card approved">
          <div className="tof-date-block"><div className="tof-date-name">{DAY_NAMES[d.getDay()]}</div><div className="tof-date-num">{d.getDate()}</div><div className="tof-date-month">{MONTHS[d.getMonth()]} {d.getFullYear()}</div></div>
          <div><div className="tof-meta">{r.type} · {w?.id||r.workerId} · {relativeTime(r.assignedAt)}</div><div className="tof-name">{w?.name||r.workerId}</div>{r.note&&<div className="tof-note">"{r.note}"</div>}<div style={{fontSize:11,color:'var(--ink-3)',marginTop:4}}>Assigned by {assigner?.name||r.assignedBy}</div></div>
          <div className="tof-actions"><button className="btn btn-sm btn-ghost" style={{borderColor:'var(--accent)',color:'var(--accent)'}} onClick={()=>remove(r.id)}>Remove</button></div>
        </div>);
      })}
    </div>
  );
}

                  const alt=(li+di)%2===0;
                  return (

                      {(()=>{const prod=dayShifts[0]?.productId;const lineProd=grid[line.id][0][0]?.productId;if(prod&&prod!==lineProd)return <div style={{fontSize:7.5,color:'#7a7068',fontStyle:'italic',marginBottom:3,paddingBottom:2,borderBottom:'1px dashed #ddd5c4'}}>{productName(prod)}</div>;return null;})()}
                      {dayShifts.length===0?(showEmpty&&<div style={{fontSize:8,color:'#ccc',fontStyle:'italic',padding:'2px 0'}}>—</div>):dayShifts.map(s=>{

                        if(!showEmpty&&!w)return null;

                            {showTimes&&!compactMode&&<div className="pt-time">{s.startTime}–{s.endTime}</div>}
                          </div>
                        );
                      })}
                    </td>
                  );
                })}

            ))}

        </table>
        <div className="pt-summary">

          <div className="pt-sum-cell" style={{background:'#1a1614',color:'#f5f1ea'}}>

            <div className="pt-sum-label" style={{color:'rgba(245,241,234,.6)'}}>{grandTotal?Math.round(grandFilled/grandTotal*100):0}% filled</div>
          </div>
        </div>
        <div className="pt-footer">

            <span><span className="pt-legend-dot" style={{background:'#ddd5c4'}}></span>Open</span>
            <span><span className="pt-legend-dot" style={{background:'#dc4a2a'}}></span>Conflict</span>
            <span><span className="pt-legend-dot" style={{background:'#b8860b'}}></span>RDO</span>
          </div>
          <div>Crewboard · Demo Company · Confidential</div>
        </div>
      </div>
    );
  };
  return (
    <div className="fade-up">
      <div className="pv-controls non-print">
        <div>
          <div className="page-eyebrow">Print · Week of {weekLabel}</div>
          <h1 className="page-title" style={{fontSize:36}}>Print View</h1>
          {roster&&<div className="flex gap-2 items-center mt-2"><span className={`pill ${roster.status==='published'?'published':'draft'}`}>{roster.status}</span>{roster.version>0&&<span className="text-xs muted">v{roster.version}</span>}{roster.status!=='published'&&<span className="text-xs" style={{color:'var(--warn)'}}>⚠ Draft — publish before distributing</span>}</div>}
        </div>

/* ── SKU Templates View ── */
function SKUTemplatesView() {
  const [products,setProducts]=useState([]);
  const [lines,setLines]=useState([]);
  const [templates,setTemplates]=useState({});
  const [selectedPid,setSelectedPid]=useState(null);
  const [editPositions,setEditPositions]=useState([]);
  const [newRole,setNewRole]=useState(ROLES[0]);
  const [newCount,setNewCount]=useState(1);
  const [toast,setToast]=useState('');
  const [saving,setSaving]=useState(false);
  const [dirty,setDirty]=useState(false);
  
  const [showAddSku,setShowAddSku]=useState(false);
  const [newSku,setNewSku]=useState({name:'',lineId:'L1',replicateFrom:''});
  const [addSkuBusy,setAddSkuBusy]=useState(false);
  const [addSkuErr,setAddSkuErr]=useState('');
  const load=async()=>{
    const p=(await Store.get('products'))||[];
    const l=(await Store.get('lines'))||[];
    const t=(await Store.get('skuTemplates'))||{};
    setProducts(p);setLines(sortLinesForDisplay(l));setTemplates(t);
    if(!selectedPid&&p.length){
      const first=p.find(x=>t[x.id]);
      if(first){setSelectedPid(first.id);setEditPositions([...(t[first.id]?.positions||[])]);}
    }
  };
  useEffect(()=>{load();},[]);
  const selectProduct=(pid)=>{
    if(dirty&&!confirm('Discard unsaved changes?'))return;
    setSelectedPid(pid);
    setEditPositions([...(templates[pid]?.positions||[])]);
    setDirty(false);
  };
  const saveTemplate=async()=>{
    if(!selectedPid)return;
    setSaving(true);
    // Persist to Supabase sku_templates table (upsert)
    const {error}=await sb.from('sku_templates').upsert({
      product_id:selectedPid,
      positions:editPositions,
      updated_at:new Date().toISOString(),
    },{onConflict:'product_id'});
    if(error) console.error('[Crewboard] saveTemplate:',error);
    const updated={...templates,[selectedPid]:{positions:editPositions}};
    setTemplates(updated);
    setSaving(false);setDirty(false);
    setToast('Template saved.');setTimeout(()=>setToast(''),2500);
  };
  const addSku=async()=>{
    setAddSkuErr('');
    const name=(newSku.name||'').trim();
    if(!name){setAddSkuErr('SKU name is required.');return;}
    if(products.find(p=>p.name.toLowerCase()===name.toLowerCase())){setAddSkuErr('A product with this name already exists.');return;}
    setAddSkuBusy(true);
    // Generate next ID
    const linePrefix=newSku.lineId==='L1'?'P':newSku.lineId==='L2'?'P':'P';
    const allNums=products.map(p=>parseInt(p.id.replace(/[^\d]/g,''))||0).filter(n=>n>0);
    const nextNum=(Math.max(0,...allNums)+1);
    const newId=`P${String(nextNum).padStart(2,'0')}`;
    const {error}=await sb.from('products').insert({
      id:newId,name,line_id:newSku.lineId,
    });
    if(error){setAddSkuErr(error.message);setAddSkuBusy(false);return;}
    // If replicating positions from another product
    if(newSku.replicateFrom&&templates[newSku.replicateFrom]?.positions?.length){
      const copiedPositions=[...templates[newSku.replicateFrom].positions];
      await sb.from('sku_templates').upsert({
        product_id:newId,positions:copiedPositions,updated_at:new Date().toISOString(),
      },{onConflict:'product_id'});
      const updated={...templates,[newId]:{positions:copiedPositions}};
      setTemplates(updated);
    }
    await load();
    setShowAddSku(false);
    setNewSku({name:'',lineId:'L1',replicateFrom:''});
    setAddSkuBusy(false);
    setToast(`${name} added (${newId}).`);
    setTimeout(()=>setToast(''),3000);
    
    setSelectedPid(newId);
    setEditPositions([...(templates[newId]?.positions||[])]);
    setDirty(false);
  };
  const removeSku=async(pid)=>{
    const p=products.find(x=>x.id===pid);
    if(!confirm(`Remove "${p?.name||pid}" from the product list?\n\nThis will also delete its position template. Existing roster shifts using this SKU will still show on existing rosters but the SKU won't appear in new dropdowns.`))return;
    await sb.from('products').delete().eq('id',pid);
    await sb.from('sku_templates').delete().eq('product_id',pid);
    const updated={...templates};delete updated[pid];
    setTemplates(updated);
    if(selectedPid===pid){setSelectedPid(null);setEditPositions([]);}
    await load();
    setToast(`${p?.name||pid} removed.`);setTimeout(()=>setToast(''),3000);
  };
  const removePosition=(idx)=>{setEditPositions(editPositions.filter((_,i)=>i!==idx));setDirty(true);};
  const addPosition=()=>{if(!newRole||newCount<1)return;setEditPositions([...editPositions,{role:newRole,count:Number(newCount)}]);setNewRole(ROLES[0]);setNewCount(1);setDirty(true);};
  const updateCount=(idx,val)=>{const n=Math.max(1,Number(val)||1);setEditPositions(editPositions.map((p,i)=>i===idx?{...p,count:n}:p));setDirty(true);};
  const movePosition=(idx,dir)=>{const arr=[...editPositions];const swap=idx+dir;if(swap<0||swap>=arr.length)return;[arr[idx],arr[swap]]=[arr[swap],arr[idx]];setEditPositions(arr);setDirty(true);};
  const totalCount=editPositions.reduce((s,p)=>s+p.count,0);
  const productsByLine={};lines.forEach(l=>{productsByLine[l.id]=[];});
  products.forEach(p=>{if(productsByLine[p.lineId])productsByLine[p.lineId].push(p);});
  const selectedProduct=products.find(p=>p.id===selectedPid);
  const selectedLine=selectedProduct?lines.find(l=>l.id===selectedProduct.lineId):null;
  const hasDefault=selectedPid&&!!SKU_POSITION_TEMPLATES[selectedPid];
  // Products that have templates (for replicate dropdown)
  const productsWithTemplates=products.filter(p=>templates[p.id]?.positions?.length);
  return (
    <div className="fade-up">
      <div className="page-head">
        <div>
          <div className="page-eyebrow">Configuration · Position mapping</div>
          <h1 className="page-title">SKU Templates</h1>
        </div>
        <div className="page-actions">
          <button className="btn btn-accent" onClick={()=>{setShowAddSku(!showAddSku);setAddSkuErr('');}}>
            {showAddSku?'✕ Cancel':'+ Add SKU'}
          </button>
        </div>
      </div>
      {toast&&<div className="alert confirm mb-4"><span className="alert-mark">✓</span><div>{toast}</div></div>}
      {/* ── Add SKU panel ── */}
      {showAddSku&&(
        <div className="card mb-6">
          <div className="card-head"><div className="card-title">Add new SKU</div></div>
          <div className="grid-2 mb-4">
            <div>
              <label className="label">SKU / Product Name</label>
              <input className="input" placeholder="e.g. Demo Item 01"
                value={newSku.name} onChange={e=>setNewSku({...newSku,name:e.target.value})}
                autoFocus />
            </div>
            <div>
              <label className="label">Line</label>
              <select className="select" value={newSku.lineId} onChange={e=>setNewSku({...newSku,lineId:e.target.value})}>
                {lines.filter(l=>['L1','L2','L4'].includes(l.id)).map(l=>(
                  <option key={l.id} value={l.id}>{l.name} — {l.description}</option>
                ))}
              </select>
            </div>
          </div>
          <div className="mb-4">
            <label className="label">Copy positions from existing SKU (optional)</label>
            <select className="select" value={newSku.replicateFrom} onChange={e=>setNewSku({...newSku,replicateFrom:e.target.value})}>
              <option value="">— Start blank —</option>
              {lines.filter(l=>['L1','L2','L4'].includes(l.id)).map(line=>{
                const lineProds=productsWithTemplates.filter(p=>p.lineId===line.id);
                if(!lineProds.length)return null;
                return(
                  <optgroup key={line.id} label={`${line.name} — ${line.description}`}>
                    {lineProds.map(p=>{
                      const total=templates[p.id]?.positions?.reduce((s,x)=>s+x.count,0)||0;
                      return <option key={p.id} value={p.id}>{p.name} ({total} positions)</option>;
                    })}
                  </optgroup>

            </select>

              <div style={{marginTop:6,fontSize:11,fontFamily:"'IBM Plex Mono',monospace",color:'var(--confirm)'}}>
                ✓ Will copy {templates[newSku.replicateFrom]?.positions?.reduce((s,x)=>s+x.count,0)||0} positions from {products.find(p=>p.id===newSku.replicateFrom)?.name}. You can edit them after.
              </div>

                        title={`Remove ${p.name}`}

              </div>
              {/* Add position row */}
              <div style={{marginTop:16,paddingTop:14,borderTop:'1px solid var(--rule-soft)',display:'flex',gap:8,alignItems:'flex-end',flexWrap:'wrap'}}>
                <div style={{flex:'0 0 auto',minWidth:200}}>
                  <label className="label">Role</label>
                  <select className="select" value={newRole} onChange={e=>setNewRole(e.target.value)}>
                    {ROLES.map(r=><option key={r} value={r}>{r}</option>)}
                  </select>
                </div>
                <div style={{flex:'0 0 70px'}}>
                  <label className="label">Count</label>
                  <input type="number" className="input" min="1" max="20" value={newCount}
                    onChange={e=>setNewCount(Math.max(1,Number(e.target.value)||1))}
                    style={{fontFamily:"'IBM Plex Mono',monospace"}} />
                </div>
                <button className="btn" onClick={addPosition}>+ Add position</button>
              </div>
            </div>
            {editPositions.length>0&&(
              <div style={{marginTop:10,padding:'10px 14px',background:'var(--paper-2)',border:'1px solid var(--rule-soft)',fontSize:11,fontFamily:"'IBM Plex Mono',monospace",color:'var(--ink-3)'}}>
                {editPositions.map(p=>`${p.role}×${p.count}`).join(' · ')} = <strong style={{color:'var(--ink)'}}>{totalCount} positions</strong>
              </div>
            )}
          </div>
        ):(
          <div className="empty-state">Select a product to view or edit its position template.</div>
        )}
      </div>
    </div>
  );
}

    /* ── Change Log ── */

    /* ── The Whiteboard (manager announcements) ── */
    function ManagerWhiteboard(){
      const { user } = useAuth();
      const [current, setCurrent] = useState(null);
      const [draft, setDraft] = useState('');
      const [saving, setSaving] = useState(false);
      const [loaded, setLoaded] = useState(false);

      async function load(){
        const { data } = await sb.from('announcements')
          .select('*').eq('active', true)
          .order('created_at', { ascending:false }).limit(1);
        setCurrent(data && data[0] ? data[0] : null);
        setLoaded(true);
      }
      useEffect(()=>{ load(); }, []);

      async function post(){
        const msg = draft.trim();
        if(!msg) return;
        setSaving(true);
        await sb.from('announcements').update({ active:false }).eq('active', true);
        await sb.from('announcements').insert({ message: msg, author: user ? user.name : null, active:true });
        setDraft('');
        await load();
        setSaving(false);
      }

      async function clearBoard(){
        setSaving(true);
        await sb.from('announcements').update({ active:false }).eq('active', true);
        await load();
        setSaving(false);
      }

      return (
        <div className="fade-up">
          <div className="page-head">
            <div>
              <h1>The Whiteboard</h1>
              <div className="muted" style={{marginTop:'6px'}}>Post a short message that every worker sees on their app.</div>
            </div>
          </div>

          <div className="card pad" style={{marginBottom:'24px'}}>
            <div style={{fontFamily:"'IBM Plex Mono',monospace",fontSize:'10px',textTransform:'uppercase',letterSpacing:'.12em',color:'var(--ink-3)',marginBottom:'10px'}}>Currently on the board</div>
            {!loaded ? (
              <div className="muted">Loading…</div>
            ) : current ? (
              <div>
                <div style={{fontSize:'18px',lineHeight:'1.5',color:'var(--ink)',whiteSpace:'pre-wrap'}}>{current.message}</div>
                <div className="muted" style={{marginTop:'12px',fontSize:'12px'}}>
                  {current.author ? 'Posted by ' + current.author : 'Posted'}
                  {current.created_at ? ' · ' + new Date(current.created_at).toLocaleString() : ''}
                </div>
                <button className="btn btn-ghost btn-sm" style={{marginTop:'14px'}} onClick={clearBoard} disabled={saving}>Clear the board</button>
              </div>
            ) : (
              <div className="muted">The board is empty. Post a message below and it will appear for all workers.</div>
            )}
          </div>

          <div className="card pad">
            <div style={{fontFamily:"'IBM Plex Mono',monospace",fontSize:'10px',textTransform:'uppercase',letterSpacing:'.12em',color:'var(--ink-3)',marginBottom:'10px'}}>New message</div>
            <textarea className="textarea" rows={3} value={draft} maxLength={280}
              placeholder="e.g. Fire drill at 2pm today — please gather at the north car park."
              onChange={e=>setDraft(e.target.value)} />
            <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginTop:'14px',gap:'16px'}}>
              <span className="muted" style={{fontSize:'12px'}}>{draft.length}/280 · Replaces the current message.</span>
              <button className="btn btn-accent" onClick={post} disabled={saving || !draft.trim()}>{saving ? 'Posting…' : 'Post to board'}</button>
            </div>
          </div>
        </div>
      );
    }

    function ChangeLogView(){
      const [weekStart,setWeekStart]=useState(()=>startOfWeek(new Date()));
      const [roster,setRoster]=useState(null);
      useEffect(()=>{(async()=>{ setRoster(await Store.get(`roster:${isoWeekKey(weekStart)}`)); })();},[weekStart]);
      const log=(roster?.changeLog||[]).slice().reverse();
      const shift=(d)=>setWeekStart(addDays(weekStart,d));
      return (
        <div className="fade-up">
          <div className="page-head">
            <div>
              <h1>Change Log</h1>
              <p className="muted">Week of {fmtDate(weekStart)}</p>
            </div>
            <div className="head-actions">
              <button className="btn ghost" onClick={()=>shift(-7)}>‹ Prev</button>
              <button className="btn ghost" onClick={()=>setWeekStart(startOfWeek(new Date()))}>This Week</button>
              <button className="btn ghost" onClick={()=>shift(7)}>Next ›</button>
            </div>
          </div>
          <div className="card">
            {log.length===0 ? <p className="muted pad">No changes recorded for this week.</p> : (
              <ul className="log-list">
                {log.map((e,i)=>(
                  <li key={i} className="log-item">
                    <span className="log-dot" style={{background:e.type==='add'?'var(--confirm)':e.type==='remove'?'var(--accent)':'var(--warn)'}}></span>
                    <div className="log-body">
                      <div className="log-msg">{e.message}</div>
                      <div className="log-meta muted">{e.by} · {e.at}</div>
                    </div>
                  </li>
                ))}
              </ul>
            )}
          </div>
        </div>
      );
    }

    /* ── App Root ── */
    function App(){
      const {user,loading}=useAuth();
      if(loading) return (
        <div className="splash">
          <img src={LOGO_URI} alt="logo" className="splash-logo" />
          <div className="spinner"></div>
        </div>
      );
      if(!user) return <LoginScreen />;
      return <ManagerApp />;
    }

    class ErrorBoundary extends React.Component{
      constructor(p){ super(p); this.state={err:null}; }
      static getDerivedStateFromError(err){ return {err}; }
      componentDidCatch(err,info){ console.error('App error:',err,info); }
      render(){
        if(this.state.err){
          return (
            <div className="error-overlay">
              <h2>Something went wrong</h2>
              <pre>{String(this.state.err && this.state.err.stack || this.state.err)}</pre>
              <button className="btn primary" onClick={()=>location.reload()}>Reload</button>
            </div>
          );
        }
        return this.props.children;
      }
    }

      const root=ReactDOM.createRoot(document.getElementById('root'));
    root.render(<ErrorBoundary><AuthProvider><App /></AuthProvider></ErrorBoundary>);
  </script>
