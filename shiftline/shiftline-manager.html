function ManagerRoster() {
  const { user } = useAuth();
  const [weekStart, setWeekStart] = useState(() => startOfWeek(new Date()));
  const [roster, setRoster] = useState(null);
  const [users, setUsers] = useState([]);
  const [lines, setLines] = useState([]);
  const [products, setProducts] = useState([]);
  const [rdoRequests, setRdoRequests] = useState([]);
  const [skuTemplates, setSkuTemplates] = useState({});
  const [editing, setEditing] = useState(null); // {shift, mode}
  const [saving, setSaving] = useState(false);
  const [saveStatus, setSaveStatus] = useState({ state:'idle', at:null, error:null });
  const [toast, setToast] = useState('');

  // Drag-and-drop state — must be declared before any hooks that reference it
  const dragPayload = useRef(null); // { shiftId, workerId, workerName }
  const [draggingId, setDraggingId] = useState(null);   // shift card being dragged
  const [dragOverId, setDragOverId] = useState(null);   // shift card being hovered
  const [dragOverCell, setDragOverCell] = useState(null); // 'lineId_dayIdx' key

  const loadAll = useCallback(async () => {
    const u = (await Store.get('users')) || [];
    const l = (await Store.get('lines')) || [];
    const p = (await Store.get('products')) || [];
    const rdo = (await Store.get('rdoRequests')) || [];
    const st = (await Store.get('skuTemplates')) || {};
    setUsers(u); setLines(l); setProducts(p); setRdoRequests(rdo); setSkuTemplates(st);

    const key = `roster:${isoWeekKey(weekStart)}`;
    let r = await Store.get(key);
    if (!r) {
      r = {
        weekStart: isoWeekKey(weekStart),
        status: 'draft',
        shifts: [],
        publishedAt: null,
        version: 0,
        lastSavedAt: null,
        changeLog: [],
      };
      await Store.set(key, r);
    }
    setRoster(r);
    setSaveStatus({ state:'idle', at:r.lastSavedAt, error:null });
  }, [weekStart]);

  useEffect(() => { loadAll(); }, [loadAll]);

  // Escape key cancels active drag
  useEffect(() => {
    const onKey = (e) => { if (e.key === 'Escape' && draggingId) { onShiftDragEnd(); } };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [draggingId]);

  // Atomic persist helper — reads latest from storage, applies mutator, writes back.
  // This prevents stale-closure bugs where two quick edits would clobber each other.
  const persistRoster = useCallback(async (mutator) => {
    setSaveStatus({ state:'saving', at:null, error:null });
    try {
      const key = `roster:${isoWeekKey(weekStart)}`;
      const current = (await Store.get(key)) || roster;
      const updated = mutator(current);
      if (!updated) { // mutator can return null to abort
        setSaveStatus({ state:'idle', at:current?.lastSavedAt || null, error:null });
        return null;
      }
      updated.lastSavedAt = Date.now();
      await Store.set(key, updated);
      setRoster(updated);
      setSaveStatus({ state:'saved', at:updated.lastSavedAt, error:null });
      return updated;
    } catch (e) {
      console.error('[Shiftline] save failed', e);
      setSaveStatus({ state:'error', at:null, error:e.message || 'Save failed' });
      return null;
    }
  }, [weekStart, roster]);

  const workersById = useMemo(() => {
    const m = {}; users.forEach(u => { if (u.role!=='manager') m[u.id]=u; }); return m;
  }, [users]);

  // Conflict detection: same worker on overlapping shifts in the same day,
  // OR worker scheduled on a day they have an approved RDO.
  const conflictMap = useMemo(() => {
    if (!roster) return {};
    const c = {};
    const byDayWorker = {};
    roster.shifts.forEach(s => {
      if (!s.workerId) return;
      const k = `${s.day}_${s.workerId}`;
      (byDayWorker[k] = byDayWorker[k] || []).push(s);
    });
    Object.values(byDayWorker).forEach(arr => {
      if (arr.length < 2) return;
      for (let i=0;i<arr.length;i++) for (let j=i+1;j<arr.length;j++){
        const a=arr[i],b=arr[j];
        const aS=timeToDec(a.startTime), aE=timeToDec(a.endTime);
        const bS=timeToDec(b.startTime), bE=timeToDec(b.endTime);
        if (aS < bE && bS < aE) { c[a.id]=true; c[b.id]=true; }
      }
    });
    // RDO conflicts — all stored entries are assigned (no status field)
    const ws = new Date(roster.weekStart);
    const rdoByWorkerDate = {};
    rdoRequests.forEach(r => { rdoByWorkerDate[`${r.workerId}_${r.date}`] = true; });
    roster.shifts.forEach(s => {
      if (!s.workerId) return;
      const actual = addDays(ws, s.day);
      const dateStr = ymd(actual);
      if (rdoByWorkerDate[`${s.workerId}_${dateStr}`]) c[s.id] = 'rdo';
    });
    return c;
  }, [roster, rdoRequests]);

  // Understaffed = role count < stdCount per day/line/role group
  const understaffMap = useMemo(() => {
    if (!roster) return {};
    const m = {};
    const groups = {};
    roster.shifts.forEach(s => {
      const k = `${s.day}_${s.lineId}_${s.role}`;
      (groups[k] = groups[k] || []).push(s);
    });
    Object.values(groups).forEach(arr => {
      const filled = arr.filter(s => s.workerId).length;
      const need = arr[0].stdCount || arr.length;
      if (filled < need) arr.forEach(s => { if (!s.workerId) m[s.id] = true; });
    });
    return m;
  }, [roster]);

  // SKU match validation — compares current roster positions against the SKU template
  // Returns map of 'lineId_dayIdx' → array of issues [{role, needed, have, type}]
  const skuMatchMap = useMemo(() => {
    if (!roster || !skuTemplates) return {};
    const m = {};
    lines.forEach(line => {
      for (let d = 0; d < 5; d++) {
        const dayShifts = roster.shifts.filter(s => s.lineId === line.id && s.day === d);
        if (!dayShifts.length) return;
        const productId = dayShifts[0]?.productId;
        const tmpl = productId ? skuTemplates[productId] : null;
        if (!tmpl || !tmpl.positions) return;
        const currentCounts = {};
        dayShifts.forEach(s => { currentCounts[s.role] = (currentCounts[s.role] || 0) + 1; });
        const issues = [];
        tmpl.positions.forEach(pos => {
          const cur = currentCounts[pos.role] || 0;
          if (cur < pos.count) issues.push({ role:pos.role, needed:pos.count, have:cur, type:'under' });
          else if (cur > pos.count) issues.push({ role:pos.role, needed:pos.count, have:cur, type:'over' });
        });
        Object.entries(currentCounts).forEach(([role, cnt]) => {
          if (!tmpl.positions.find(p => p.role === role))
            issues.push({ role, needed:0, have:cnt, type:'extra' });
        });
        if (issues.length) m[`${line.id}_${d}`] = issues;
      }
    });
    return m;
  }, [roster, skuTemplates, lines]);

  // Apply or change the SKU for a line/day cell.
  // If shifts already exist for this cell, intelligently diffs them:
  //   • roles in the new template that had fewer slots → add blank ones
  //   • roles in the new template that had more slots → trim (unassigned first)
  //   • roles not in the new template → removed entirely
  //   • existing worker assignments are preserved wherever the role survives
  const changeSkuForCell = async (lineId, dayIdx, newProductId) => {
    const tmpl = skuTemplates[newProductId];
    if (!tmpl || !tmpl.positions?.length) {
      setToast('No position template for this SKU. Define one in SKU Templates first.');
      setTimeout(() => setToast(''), 3000);
      return;
    }
    const def = SHIFT_DEFAULTS[lineId] || {};
    const productNm = products.find(p => p.id === newProductId)?.name || newProductId;

    await persistRoster(current => {
      const cellShifts = current.shifts.filter(s => s.lineId === lineId && s.day === dayIdx);
      const otherShifts = current.shifts.filter(s => !(s.lineId === lineId && s.day === dayIdx));

      // Group existing shifts by role
      const currentByRole = {};
      cellShifts.forEach(s => {
        (currentByRole[s.role] = currentByRole[s.role] || []).push(s);
      });

      const newCellShifts = [];

      tmpl.positions.forEach(pos => {
        const existing = [...(currentByRole[pos.role] || [])];
        if (existing.length >= pos.count) {
          // Keep `count` slots — prefer those with a worker assigned
          const sorted = [...existing].sort((a, b) => (b.workerId ? 1 : 0) - (a.workerId ? 1 : 0));
          sorted.slice(0, pos.count).forEach(s =>
            newCellShifts.push({ ...s, productId: newProductId, stdCount: pos.count })
          );
        } else {
          // Keep all existing + fill gap with blank slots
          existing.forEach(s => newCellShifts.push({ ...s, productId: newProductId, stdCount: pos.count }));
          for (let i = existing.length; i < pos.count; i++) {
            newCellShifts.push({
              id: uuid(), day: dayIdx, lineId, productId: newProductId,
              role: pos.role, workerId: null,
              startTime: def.start || '06:00', endTime: def.end || '14:30',
              stdCount: pos.count,
            });
          }
        }
      });

      const removed = cellShifts.length - newCellShifts.filter(s => cellShifts.find(c => c.id === s.id)).length;
      const added   = newCellShifts.filter(s => !cellShifts.find(c => c.id === s.id)).length;
      const note = cellShifts.length === 0
        ? `Applied SKU template: ${productNm} (${newCellShifts.length} positions) on ${DAY_FULL[dayIdx+1]} (${lineId})`
        : `Changed SKU → ${productNm} on ${DAY_FULL[dayIdx+1]} (${lineId})${removed?` −${removed}`:''}${added?` +${added}`:''}`;

      return {
        ...current,
        shifts: [...otherShifts, ...newCellShifts],
        changeLog: [...(current.changeLog || []), { ts: Date.now(), type: 'edit', day: dayIdx, summary: note }],
      };
    });

    setToast('SKU and positions updated.');
    setTimeout(() => setToast(''), 2500);
  };

  const replicatePrev = async () => {
    const prevKey = `roster:${isoWeekKey(addDays(weekStart,-7))}`;
    const prev = await Store.get(prevKey);
    if (!prev || !prev.shifts.length) { setToast('No previous week to copy from.'); return; }
    if (roster.shifts.length) {
      if (!confirm('This will REPLACE the current draft with last week\'s shifts. Continue?')) return;
    }
    await persistRoster(current => ({
      ...current,
      shifts: prev.shifts.map(s => ({...s, id: uuid()})),
      status: 'draft',
    }));
    setToast(`Copied ${prev.shifts.length} shifts from last week.`);
    setTimeout(()=>setToast(''), 3000);
  };

  const generateFromTemplate = async () => {
    if (roster.shifts.length && !confirm('Replace current shifts with a default template?')) return;
    const fresh = buildSampleRoster(weekStart, 'draft');
    fresh.changeLog = [];
    await persistRoster(() => fresh);
    setToast('Template applied. Adjust workers and publish.');
    setTimeout(()=>setToast(''), 3000);
  };

  const saveShift = async (shift, isNew) => {
    await persistRoster(current => {
      const log = [...(current.changeLog||[])];
      if (isNew) {
        return {
          ...current,
          shifts:[...current.shifts, shift],
          changeLog: [...log, {
            ts: Date.now(), type:'add', shiftId:shift.id, day:shift.day,
            summary: `Added ${shift.role} on ${DAY_FULL[shift.day+1]} (${lineName(shift.lineId)})`
          }]
        };
      }
      const oldShift = current.shifts.find(s => s.id===shift.id);
      if (!oldShift) {
        // shift no longer exists in storage (deleted elsewhere); add as new
        return { ...current, shifts:[...current.shifts, shift] };
      }
      const changes = [];
      if (oldShift.workerId !== shift.workerId) {
        const oldName = oldShift.workerId ? workersById[oldShift.workerId]?.name : '—';
        const newName = shift.workerId ? workersById[shift.workerId]?.name : '—';
        changes.push(`assignee ${oldName} → ${newName}`);
      }
      if (oldShift.startTime !== shift.startTime || oldShift.endTime !== shift.endTime) {
        changes.push(`time ${oldShift.startTime}–${oldShift.endTime} → ${shift.startTime}–${shift.endTime}`);
      }
      if (oldShift.role !== shift.role) changes.push(`role ${oldShift.role} → ${shift.role}`);
      if (oldShift.productId !== shift.productId) changes.push(`product changed`);

      return {
        ...current,
        shifts: current.shifts.map(s => s.id===shift.id?shift:s),
        changeLog: changes.length ? [...log, {
          ts: Date.now(), type:'edit', shiftId:shift.id, day:shift.day,
          summary: `Updated ${shift.role} on ${DAY_FULL[shift.day+1]}: ${changes.join(', ')}`
        }] : log
      };
    });
    setEditing(null);
  };

  const deleteShift = async (shiftId) => {
    if (!confirm('Remove this shift?')) return;
    await persistRoster(current => {
      const s = current.shifts.find(x=>x.id===shiftId);
      if (!s) return null;
      return {
        ...current,
        shifts: current.shifts.filter(x=>x.id!==shiftId),
        changeLog: [...(current.changeLog||[]), {
          ts: Date.now(), type:'remove', shiftId, day:s.day,
          summary:`Removed ${s.role} on ${DAY_FULL[s.day+1]} (${lineName(s.lineId)})`
        }]
      };
    });
    setEditing(null);
  };

const saveDraft = async () => {
    // Manual save lever — just re-persists the current state, useful as a recovery action
    await persistRoster(current => ({...current}));
    setToast('Draft saved.');
    setTimeout(()=>setToast(''), 2000);
  };

  const copyDay = async (srcDayIdx, dstDayIdx) => {
    const srcShifts = roster.shifts.filter(s => s.day === srcDayIdx);
    if (!srcShifts.length) {
      setToast('No shifts on that day to copy.');
      setTimeout(()=>setToast(''), 2500);
      return;
    }
    const srcName = DAY_FULL[addDays(weekStart, srcDayIdx).getDay()];
    const dstName = DAY_FULL[addDays(weekStart, dstDayIdx).getDay()];
    const dstHasShifts = roster.shifts.some(s => s.day === dstDayIdx);
    if (!confirm(`Copy all ${srcShifts.length} shifts from ${srcName} to ${dstName}?${dstHasShifts ? `\n\nExisting shifts on ${dstName} will be replaced.` : ''}`)) return;
    await persistRoster(current => {
      const otherShifts = current.shifts.filter(s => s.day !== dstDayIdx);
      const copied = current.shifts
        .filter(s => s.day === srcDayIdx)
        .map(s => ({ ...s, id: uuid(), day: dstDayIdx }));
      return {
        ...current,
        shifts: [...otherShifts, ...copied],
        changeLog: [...(current.changeLog||[]), {
          ts: Date.now(), type: 'edit', day: dstDayIdx,
          summary: `Copied ${copied.length} shifts from ${srcName} → ${dstName}`,
        }],
      };
    });
    setToast(`Copied ${srcShifts.length} shifts from ${srcName} to ${dstName}.`);
    setTimeout(()=>setToast(''), 3000);
  };

  const publish = async () => {
    const realConflicts = Object.entries(conflictMap).filter(([k,v]) => v !== 'rdo');
    if (realConflicts.length) {
      if (!confirm(`There are ${realConflicts.length} conflict(s). Publish anyway?`)) return;
    }
    setSaving(true);
    const prevPub     = roster.publishedAt || 0;
    const prevVersion = roster.version || 0;
    const updated = await persistRoster(current => ({
      ...current,
      status: 'published',
      publishedAt: Date.now(),
      version: (current.version || 0) + 1,
    }));
    if (!updated) { setSaving(false); return; }

    // Determine which workers to notify
    const newChanges = (updated.changeLog || []).filter(c => c.ts > prevPub);
    const affectedWorkers = new Set();
    if (prevVersion === 0) {
      // First publish — notify everyone with a shift
      updated.shifts.forEach(s => { if (s.workerId) affectedWorkers.add(s.workerId); });
    } else {
      newChanges.forEach(c => {
        const s = updated.shifts.find(x => x.id === c.shiftId);
        if (s && s.workerId) affectedWorkers.add(s.workerId);
      });
      // Fallback: if no tracked changes, notify all assigned workers
      if (affectedWorkers.size === 0) {
        updated.shifts.forEach(s => { if (s.workerId) affectedWorkers.add(s.workerId); });
      }
    }

    const weekLabel = fmtDate(weekStart);
    const changeCount = newChanges.length;

    for (const wid of affectedWorkers) {
      const title   = `Roster ${prevVersion === 0 ? 'published' : 'updated'} — week of ${weekLabel}`;
      const summary = prevVersion === 0
        ? `Your schedule for the week of ${weekLabel} is ready. Open Shiftline to view your shifts.`
        : changeCount > 0
        ? `${changeCount} change${changeCount !== 1 ? 's' : ''} to the roster affect your schedule. Open Shiftline to review.`
        : `Your weekly schedule has been updated. Open Shiftline to review.`;

      // 1. Persist to Supabase
      const { data: notifRow } = await sb.from('notifications').insert({
        worker_id:  wid,
        title,
        summary,
        type:       'roster',
        week_start: isoWeekKey(weekStart),
        unread:     true,
      }).select().single();

      // 2. Broadcast live to worker's phone (instant if app is open)
      await sb.channel(`notify:${wid}`).send({
        type:  'broadcast',
        event: 'new_notification',
        payload: {
          id:        notifRow?.id || uuid(),
          ts:        Date.now(),
          unread:    true,
          type:      'roster',
          title,
          summary,
          weekStart: isoWeekKey(weekStart),
        },
      });
    }

    // Send real Web Push notifications (works when app is closed/background)
    try {
      const pushRes = await fetch(`${SUPABASE_URL}/functions/v1/send-push`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${SUPABASE_ANON}`,
          'apikey': SUPABASE_ANON,
        },
        body: JSON.stringify({
          workerIds: [...affectedWorkers],
          title,
          summary,
          weekStart: isoWeekKey(weekStart),
        }),
      });
      const pushData = await pushRes.json();
      console.log('[Shiftline] Push result:', pushData);
    } catch (e) {
      console.warn('[Shiftline] Push send failed (non-fatal):', e);
    }

    setSaving(false);
    setToast(`✓ Published v${updated.version} · ${affectedWorkers.size} worker${affectedWorkers.size !== 1 ? 's' : ''} notified`);
    setTimeout(() => setToast(''), 4000);
  };

  const lineName = (id) => lines.find(l=>l.id===id)?.name || id;
  const productName = (id) => products.find(p=>p.id===id)?.name || id;

  /* ---- Drag and Drop handlers ---- */
  const onShiftDragStart = (e, shift) => {
    if (!shift.workerId) { e.preventDefault(); return; }
    const w = workersById[shift.workerId];
    dragPayload.current = { shiftId: shift.id, workerId: shift.workerId, workerName: w?.name || shift.workerId };
    setDraggingId(shift.id);
    // Custom drag ghost
    const ghost = document.getElementById('__drag_ghost__');
    if (ghost) {
      ghost.textContent = w?.name || shift.workerId;
      e.dataTransfer.setDragImage(ghost, 0, 0);
    }
    e.dataTransfer.effectAllowed = 'move';
  };

  const onShiftDragEnd = () => {
    dragPayload.current = null;
    setDraggingId(null);
    setDragOverId(null);
    setDragOverCell(null);
  };

  const onShiftDragOver = (e, shiftId) => {
    if (!dragPayload.current || dragPayload.current.shiftId === shiftId) return;
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
    setDragOverId(shiftId);
  };

  const onShiftDragLeave = () => setDragOverId(null);

  const onShiftDrop = async (e, dstShiftId) => {
    e.preventDefault();
    setDragOverId(null);
    const src = dragPayload.current;
    if (!src || src.shiftId === dstShiftId) { onShiftDragEnd(); return; }
    const srcId = src.shiftId;

    await persistRoster(current => {
      const srcShift = current.shifts.find(s => s.id === srcId);
      const dstShift = current.shifts.find(s => s.id === dstShiftId);
      if (!srcShift) return null;

      const srcWorker = workersById[srcShift.workerId];
      const dstWorker = dstShift?.workerId ? workersById[dstShift.workerId] : null;

      const logEntry = dstShift?.workerId
        ? { ts:Date.now(), type:'edit', shiftId:srcId, day:srcShift.day,
            summary:`Swapped ${srcWorker?.name||srcId} ↔ ${dstWorker?.name||dstShift.workerId} (drag)` }
        : { ts:Date.now(), type:'edit', shiftId:srcId, day:srcShift.day,
            summary:`Moved ${srcWorker?.name||srcId} to ${dstShift?.role||''} on ${DAY_FULL[(dstShift?.day||0)+1]} (drag)` };

      return {
        ...current,
        shifts: current.shifts.map(s => {
          if (s.id === srcId)    return { ...s, workerId: dstShift?.workerId || null };
          if (s.id === dstShiftId) return { ...s, workerId: src.workerId };
          return s;
        }),
        changeLog: [...(current.changeLog||[]), logEntry],
      };
    });

    setDraggingId(null);
    dragPayload.current = null;
  };

  if (!roster) return <div className="empty-state">Loading roster…</div>;

  const totalSlots = roster.shifts.length;
  const filled = roster.shifts.filter(s => s.workerId).length;
  const conflictCount = Object.keys(conflictMap).length;
  const understaffCount = Object.keys(understaffMap).length;
  const skuGapCount = Object.keys(skuMatchMap).length;
  const lastPub = roster.publishedAt || 0;
  const pendingChanges = (roster.changeLog || []).filter(c => c.ts > lastPub).length;

  // Group shifts by line then day
  const shiftsByLineDay = {};
  lines.forEach(l => {
    shiftsByLineDay[l.id] = [[],[],[],[],[]];
  });
  roster.shifts.forEach(s => {
    if (shiftsByLineDay[s.lineId]) shiftsByLineDay[s.lineId][s.day].push(s);
  });

  return (
    <div className="fade-up">
      <div className="page-head">
        <div>
          <div className="page-eyebrow">Plan · Week of {fmtFullDate(weekStart)}</div>
          <h1 className="page-title">Weekly Roster</h1>
          <div className="flex gap-2 items-center mt-3 flex-wrap">
            <span className={`pill ${roster.status==='published'?'published':'draft'}`}>{roster.status}</span>
            {roster.version > 0 && <span className="text-xs muted">v{roster.version}</span>}
            {pendingChanges > 0 && roster.status==='published' && <span className="pill accent">{pendingChanges} unpublished change{pendingChanges!==1?'s':''}</span>}
            {pendingChanges > 0 && roster.status==='draft' && <span className="pill draft">{pendingChanges} change{pendingChanges!==1?'s':''} in draft</span>}
            <SaveStatus status={saveStatus} />
          </div>
        </div>
        <div className="page-actions">
          <button className="btn btn-sm" onClick={()=>setWeekStart(addDays(weekStart,-7))}>← Prev Week</button>
          <button className="btn btn-sm" onClick={()=>setWeekStart(startOfWeek(new Date()))}>This Week</button>
          <button className="btn btn-sm" onClick={()=>setWeekStart(addDays(weekStart,7))}>Next Week →</button>
          <span style={{width:1,background:'var(--rule-soft)'}}></span>
          <button className="btn" onClick={replicatePrev}>↻ Copy Last Week</button>
          {roster.shifts.length === 0 && <button className="btn" onClick={generateFromTemplate}>+ Use Template</button>}
          <button className="btn" onClick={saveDraft} disabled={saveStatus.state==='saving'}>
            {saveStatus.state==='saving' ? 'Saving…' : '💾 Save Draft'}
          </button>
          <button className="btn btn-accent" onClick={publish} disabled={saving || (pendingChanges===0 && roster.status==='published')}>
            {saving ? 'Publishing…' : roster.status==='draft' ? 'Publish Roster' : `Publish ${pendingChanges} Change${pendingChanges!==1?'s':''}`}
          </button>
        </div>
      </div>

      <div className="stats">
        <div className="stat">
          <div className="stat-eyebrow">Total Shifts</div>
          <div className="stat-num">{totalSlots}</div>
          <div className="stat-meta">across {lines.length} lines</div>
        </div>
        <div className="stat">
          <div className="stat-eyebrow">Filled</div>
          <div className="stat-num">{filled}<span style={{fontSize:18,color:'var(--ink-3)'}}>/{totalSlots}</span></div>
          <div className="stat-meta">{totalSlots ? Math.round(filled/totalSlots*100):0}% of all slots</div>
        </div>
        <div className="stat" style={conflictCount?{background:'var(--accent-soft)'}:{}}>
          <div className="stat-eyebrow">Conflicts</div>
          <div className="stat-num" style={conflictCount?{color:'var(--accent)'}:{}}>{conflictCount}</div>
          <div className="stat-meta">{conflictCount?'Resolve before publish':'No double-bookings'}</div>
        </div>
        <div className="stat" style={understaffCount?{background:'var(--warn-soft)'}:{}}>
          <div className="stat-eyebrow">Understaffed</div>
          <div className="stat-num" style={understaffCount?{color:'var(--warn)'}:{}}>{understaffCount}</div>
          <div className="stat-meta">unfilled slots</div>
        </div>
        <div className="stat" style={skuGapCount?{background:'var(--warn-soft)'}:{}}>
          <div className="stat-eyebrow">SKU Gaps</div>
          <div className="stat-num" style={skuGapCount?{color:'var(--warn)'}:{}}>{skuGapCount}</div>
          <div className="stat-meta">{skuGapCount?'cells vs template':'matches template'}</div>
        </div>
      </div>

      {toast && <div className="alert confirm mb-4"><span className="alert-mark">✓</span><div>{toast}</div></div>}
      {conflictCount > 0 && (
        <div className="alert mb-4">
          <span className="alert-mark">!</span>
          <div>
            <strong>{conflictCount} double-booking{conflictCount!==1?'s':''} detected.</strong> Workers highlighted in red are scheduled on overlapping shifts on the same day. Click any flagged shift to reassign.
          </div>
        </div>
      )}

      {/* Hidden element used as the drag ghost image */}
      <div id="__drag_ghost__" className="drag-ghost" aria-hidden="true"></div>

      {draggingId && (
        <div className="alert warn mb-3" style={{padding:'8px 14px'}}>
          <span className="alert-mark" style={{fontSize:11}}>⇄</span>
          <div style={{fontSize:12}}>
            <strong>Drag mode:</strong> drop onto another shift to swap workers, or onto an empty slot to move. Press Esc to cancel.
          </div>
        </div>
      )}

      <div className="roster">
        <div className="roster-table">
          {/* header row */}
          <div className="r-cell r-line-head r-day" style={{background:'var(--ink)'}}>
            <div className="day-num" style={{color:'var(--paper)'}}>Lines</div>
            <span className="day-date">{lines.length} active</span>
          </div>
{[0,1,2,3,4].map(i => {
            const d = addDays(weekStart,i);
            return (
              <div key={i} className="r-cell r-day">
                <div className="day-num">{DAY_FULL[d.getDay()]}</div>
                <span className="day-date">{fmtDate(d)}</span>
                <select
                  style={{marginTop:6,fontSize:9,padding:'2px 4px',background:'rgba(255,255,255,.08)',color:'var(--paper)',border:'1px solid rgba(255,255,255,.2)',fontFamily:"'IBM Plex Mono',monospace",width:'100%',cursor:'pointer',borderRadius:0}}
                  defaultValue=""
                  onChange={e=>{
                    if(e.target.value!==''){
                      copyDay(i, parseInt(e.target.value));
                      e.target.value='';
                    }
                  }}
                >
                  <option value="">Copy to…</option>
                  {[0,1,2,3,4].filter(j=>j!==i).map(j=>(
                    <option key={j} value={j}>{DAY_FULL[addDays(weekStart,j).getDay()]}</option>
                  ))}
                </select>
              </div>
            );
          })}
          {/* line rows */}
          {lines.map(line => (
            <React.Fragment key={line.id}>
              <div className="r-cell r-line-head">
                <div>
                  <div className="r-line-name">{line.name}</div>
                  <div className="r-line-meta">{line.id}</div>
                </div>
                <div className="r-line-prod">{line.description}</div>
              </div>
              {[0,1,2,3,4].map(dayIdx => {
                const dayShifts = shiftsByLineDay[line.id][dayIdx];
                const productId = dayShifts[0]?.productId;
                const cellKey = `${line.id}_${dayIdx}`;
                const isCellOver = dragOverCell === cellKey;
                return (
                  <div
                    key={dayIdx}
                    className={`r-cell${isCellOver?' drag-target':''}`}
                    onDragOver={e => { if (dragPayload.current) { e.preventDefault(); setDragOverCell(cellKey); }}}
                    onDragLeave={() => setDragOverCell(null)}
                    onDrop={e => { setDragOverCell(null); }}
                  >
                    {/* SKU selector — always visible at top of cell (hidden during drag) */}
                    {!draggingId && (
                      <div style={{marginBottom:6,paddingBottom:6,borderBottom:'1px dashed var(--rule-soft)'}}>
                        <select
                          className="select"
                          style={{fontSize:10,padding:'3px 6px',fontFamily:"'IBM Plex Mono',monospace"}}
                          value={productId || ''}
                          onChange={e => { if (e.target.value) changeSkuForCell(line.id, dayIdx, e.target.value); }}
                        >
                          <option value="">— Select SKU —</option>
                          {products.filter(p => p.lineId === line.id).map(p => (
                            <option key={p.id} value={p.id}>{p.name}</option>
                          ))}
                        </select>
                        {skuMatchMap[cellKey] && (
                          <div style={{marginTop:4,fontSize:9,fontFamily:"'IBM Plex Mono',monospace",color:'var(--warn)',display:'flex',alignItems:'center',gap:4}}
                            title={skuMatchMap[cellKey].map(i=>`${i.role}: need ${i.needed}, have ${i.have}`).join('\n')}>
                            <span>⚠</span>
                            <span>{skuMatchMap[cellKey].length} position gap{skuMatchMap[cellKey].length!==1?'s':''}</span>
                          </div>
                        )}
                      </div>
                    )}
                    {/* During drag: show product name as plain text */}
                    {draggingId && productId && (
                      <div style={{fontSize:10,fontFamily:"'IBM Plex Mono',monospace",textTransform:'uppercase',letterSpacing:'.1em',color:'var(--ink-3)',marginBottom:6,paddingBottom:4,borderBottom:'1px dashed var(--rule-soft)'}}>
                        ▸ {productName(productId)}
                      </div>
                    )}
                    {dayShifts.map(shift => {
                      const w = shift.workerId ? workersById[shift.workerId] : null;
                      const conflictKind = conflictMap[shift.id];
                      const isConflict = conflictKind && conflictKind !== 'rdo';
                      const isRdoConflict = conflictKind === 'rdo';
                      const isUnder = understaffMap[shift.id];
                      const isDragging = draggingId === shift.id;
                      const isDragOver = dragOverId === shift.id;
                      const isDragActive = !!draggingId;
                      const cls = [
                        'shift',
                        isConflict || isRdoConflict ? 'conflict' : '',
                        isUnder ? 'understaffed' : '',
                        isDragging ? 'is-dragging' : '',
                        isDragOver ? 'drag-over' : '',
                      ].filter(Boolean).join(' ');
                      return (
                        <button
                          key={shift.id}
                          className={cls}
                          draggable={!!shift.workerId}
                          onClick={() => !isDragActive && setEditing({shift, mode:'edit'})}
                          onDragStart={e => onShiftDragStart(e, shift)}
                          onDragEnd={onShiftDragEnd}
                          onDragOver={e => onShiftDragOver(e, shift.id)}
                          onDragLeave={onShiftDragLeave}
                          onDrop={e => onShiftDrop(e, shift.id)}
                          title={w ? `Drag to reassign ${w.name}` : 'Click to assign a worker'}
                        >
                          {isRdoConflict && <span className="shift-flag" style={{background:'var(--warn)'}}>RDO</span>}
                          {w && <span style={{position:'absolute',top:4,left:4,fontSize:10,opacity:.3,pointerEvents:'none'}}>⠿</span>}
                          <div className="shift-role">
                            <span>{shift.role}</span>
                          </div>
                          <div className={`shift-worker ${!w?'empty':''}`}>{w?w.name:'— unassigned —'}</div>
                          <div className="shift-time mono">{shift.startTime} → {shift.endTime}</div>
                        </button>
                      );
                    })}
                    {draggingId ? (
                      <div className="drop-hint"
                        onDragOver={e=>e.preventDefault()}
                        onDrop={e=>{
                          e.preventDefault();
                          const src = dragPayload.current;
                          if (!src) return;
                          const empty = dayShifts.find(s => !s.workerId);
                          if (empty) onShiftDrop(e, empty.id);
                          else setDragOverId(null);
                        }}
                      >drop here to assign</div>
                    ) : null}
                  </div>
                );
              })}
            </React.Fragment>
          ))}
        </div>
      </div>

      {editing && (
        <ShiftModal
          shift={editing.shift}
          mode={editing.mode}
          users={users}
          lines={lines}
          products={products}
          conflictMap={conflictMap}
          existing={roster.shifts}
          rdoRequests={rdoRequests}
          weekStart={weekStart}
          onSave={saveShift}
          onDelete={deleteShift}
          onClose={()=>setEditing(null)}
        />
      )}
    </div>
  );
}

function ShiftModal({ shift, mode, users, lines, products, existing, rdoRequests, weekStart, onSave, onDelete, onClose }) {
  const [s, setS] = useState({ ...shift });

  // Day pool: workers already assigned to another shift on the same day (exclude current shift)
  const assignedOnDay = useMemo(() => {
    const set = new Set();
    existing.forEach(x => {
      if (x.id !== s.id && x.day === s.day && x.workerId) set.add(x.workerId);
    });
    return set;
  }, [existing, s.id, s.day]);

  // Available pool: exclude workers committed elsewhere today (keep current assignee visible)
  const poolWorkers = users.filter(u =>
    u.role !== 'manager' && (!assignedOnDay.has(u.id) || u.id === s.workerId)
  );
  const eligibleWorkers = poolWorkers.filter(u =>
    u.skills?.includes(s.role) || u.primaryLine === s.lineId
  );
  const otherWorkers = poolWorkers.filter(u => !eligibleWorkers.includes(u));
  const takenCount = users.filter(u => u.role !== 'manager' && assignedOnDay.has(u.id) && u.id !== s.workerId).length;

  // Check if assigned worker has an RDO on this shift's day
  const rdoConflict = useMemo(() => {
    if (!s.workerId || !weekStart || !rdoRequests) return null;
    const shiftDate = ymd(addDays(weekStart, s.day));
    return rdoRequests.find(r => r.workerId === s.workerId && r.date === shiftDate) || null;
  }, [s, rdoRequests, weekStart]);

  const lineName  = lines.find(l => l.id === s.lineId)?.name   || s.lineId;
  const skuName   = products.find(p => p.id === s.productId)?.name || s.productId || '—';

  return (
    <Portal>
    <div className="modal-overlay" onClick={onClose}>
      <div className="modal" onClick={e=>e.stopPropagation()}>
        <div className="modal-head">
          <div>
            <div className="page-eyebrow">{mode==='new'?'New shift':'Edit shift'} · {DAY_FULL[s.day+1]}</div>
            <h2 className="modal-title">{s.role || 'New Shift'}</h2>
          </div>
          <button className="btn btn-ghost btn-sm" onClick={onClose}>×</button>
        </div>
        <div className="modal-body">

          {/* Read-only context strip — Line / SKU / Role are fixed by the template */}
          <div style={{background:'var(--paper-2)',border:'1px solid var(--rule-soft)',padding:'10px 14px',marginBottom:20,display:'flex',gap:24,flexWrap:'wrap'}}>
            <div>
              <div style={{fontSize:9,fontFamily:"'IBM Plex Mono',monospace",textTransform:'uppercase',letterSpacing:'.1em',color:'var(--ink-3)'}}>Line</div>
              <div style={{marginTop:2,fontSize:13,fontWeight:500}}>{lineName}</div>
            </div>
            <div>
              <div style={{fontSize:9,fontFamily:"'IBM Plex Mono',monospace",textTransform:'uppercase',letterSpacing:'.1em',color:'var(--ink-3)'}}>SKU</div>
              <div style={{marginTop:2,fontSize:13,fontWeight:500}}>{skuName}</div>
            </div>
            <div>
              <div style={{fontSize:9,fontFamily:"'IBM Plex Mono',monospace",textTransform:'uppercase',letterSpacing:'.1em',color:'var(--ink-3)'}}>Position</div>
              <div style={{marginTop:2,fontSize:13,fontWeight:500}}>{s.role}</div>
            </div>
          </div>

          {/* Worker assignment */}
          <div className="mb-4">
            <label className="label">Assigned Worker</label>
            {takenCount > 0 && (
              <div style={{fontSize:10,fontFamily:"'IBM Plex Mono',monospace",color:'var(--ink-3)',marginBottom:6}}>
                {takenCount} worker{takenCount!==1?'s':''} already on another position today — hidden from list
              </div>
            )}
            <select className="select" value={s.workerId||''} onChange={e=>setS({...s, workerId:e.target.value || null})}>
              <option value="">— Unassigned —</option>
              {eligibleWorkers.length > 0 && (
                <optgroup label={`Skilled · available today (${eligibleWorkers.length})`}>
                  {eligibleWorkers.map(w => <option key={w.id} value={w.id}>{w.name} · {w.id}</option>)}
                </optgroup>
              )}
              {otherWorkers.length > 0 && (
                <optgroup label={`Other · available today (${otherWorkers.length})`}>
                  {otherWorkers.map(w => <option key={w.id} value={w.id}>{w.name} · {w.id}</option>)}
                </optgroup>
              )}
            </select>
            {s.workerId && (() => {
              const w = users.find(u=>u.id===s.workerId);
              return w && (
                <div className="mt-2 text-xs muted">
                  Skills: {w.skills?.map(sk => <span key={sk} className="skill-chip">{sk}</span>)}
                </div>
              );
            })()}
          </div>

          {/* Times */}
          <div className="grid-2 mb-4">
            <div>
              <label className="label">Start Time</label>
              <input type="time" className="input mono" value={s.startTime} onChange={e=>setS({...s, startTime:e.target.value})} />
            </div>
            <div>
              <label className="label">End Time</label>
              <input type="time" className="input mono" value={s.endTime} onChange={e=>setS({...s, endTime:e.target.value})} />
            </div>
          </div>
          <div className="text-xs muted">Duration: {durationHours(s.startTime, s.endTime)} hours</div>

          {rdoConflict && (
            <div className="alert warn mt-4">
              <span className="alert-mark">☼</span>
              <div>
                <strong>Approved time off:</strong> {users.find(u=>u.id===s.workerId)?.name || s.workerId} has an approved {rdoConflict.type} on this date{rdoConflict.note ? ` ("${rdoConflict.note}")` : ''}. Assigning them here overrides their day off.
              </div>
            </div>
          )}
        </div>
        <div className="modal-foot">
          {mode==='edit' ? (
            <button className="btn btn-sm" style={{borderColor:'var(--accent)',color:'var(--accent)'}} onClick={()=>onDelete(s.id)}>Delete shift</button>
          ) : <span />}
          <div className="flex gap-2">
            <button className="btn" onClick={onClose}>Cancel</button>
            <button className="btn btn-primary" onClick={()=>onSave(s, mode==='new')}>{mode==='new'?'Add Shift':'Save Changes'}</button>
          </div>
        </div>
      </div>
    </div>
    </Portal>
  );
}

function WorkerPool() {
  const [users, setUsers]       = useState([]);
  const [lines, setLines]       = useState([]);
  const [filter, setFilter]     = useState('');
  const [lineFilter, setLineFilter] = useState('');
  const [showAdd, setShowAdd]   = useState(false);
  const [newW, setNewW]         = useState({id:'',name:'',pin:'1234',primaryLine:'L1',skillsRaw:''});
  const [addErr, setAddErr]     = useState('');
  const [addBusy, setAddBusy]   = useState(false);
  const [toast, setToast]       = useState('');

  const load = async () => {
    setUsers((await Store.get('users')) || []);
    setLines((await Store.get('lines')) || []);
  };
  useEffect(() => { load(); }, []);

  const workers = users.filter(u => u.role !== 'manager');
  const filtered = workers.filter(w => {
    if (filter && !w.name.toLowerCase().includes(filter.toLowerCase()) && !w.id.toLowerCase().includes(filter.toLowerCase())) return false;
    if (lineFilter && w.primaryLine !== lineFilter) return false;
    return true;
  });

  const byLine = {};
  workers.forEach(w => { byLine[w.primaryLine] = (byLine[w.primaryLine]||0)+1; });

  const addWorker = async () => {
    setAddErr('');
    const cleanId   = (newW.id||'').toUpperCase().trim();
    const cleanName = (newW.name||'').trim();
    if (!cleanId || !cleanName) { setAddErr('Worker ID and Name are required.'); return; }
    if (workers.find(w => w.id === cleanId)) { setAddErr(`ID "${cleanId}" is already in use.`); return; }
    const skills = newW.skillsRaw.split(',').map(s=>s.trim()).filter(Boolean);
    setAddBusy(true);
    const { error } = await sb.from('users').insert({
      id:           cleanId,
      name:         cleanName,
      pin:          (newW.pin||'1234').trim(),
      role:         'worker',
      primary_line: newW.primaryLine,
      skills:       skills,
      status:       'active',
    });
    if (error) { setAddErr(error.message); setAddBusy(false); return; }
    await load();
    setShowAdd(false);
    setNewW({id:'',name:'',pin:'1234',primaryLine:'L1',skillsRaw:''});
    setToast(`${cleanName} added to the worker pool.`);
    setTimeout(()=>setToast(''), 3000);
    setAddBusy(false);
  };

  const removeWorker = async (wid) => {
    const w = workers.find(x => x.id === wid);
    if (!confirm(`Remove ${w?.name || wid} from the worker pool?\n\nThis cannot be undone. Any existing shift assignments will show as unassigned on the roster.`)) return;
    const { error } = await sb.from('users').delete().eq('id', wid);
    if (error) { alert('Error removing worker: ' + error.message); return; }
    await load();
    setToast(`${w?.name || wid} removed from the worker pool.`);
    setTimeout(()=>setToast(''), 3000);
  };

  return (
    <div className="fade-up">
      <div className="page-head">
        <div>
          <div className="page-eyebrow">Plan · Workforce</div>
          <h1 className="page-title">Worker Pool</h1>
        </div>
        <div className="page-actions">
          <span className="text-sm muted">{filtered.length} of {workers.length} workers</span>
          <button className="btn btn-accent" onClick={()=>{setShowAdd(!showAdd);setAddErr('');}}>
            {showAdd ? '✕ Cancel' : '+ Add Worker'}
          </button>
        </div>
      </div>

      {toast && <div className="alert confirm mb-4"><span className="alert-mark">✓</span><div>{toast}</div></div>}

      {showAdd && (
        <div className="card mb-6">
          <div className="card-head"><div className="card-title">Add new worker</div></div>
          <div className="grid-2 mb-4">
            <div>
              <label className="label">Worker ID</label>
              <input className="input mono" placeholder="e.g. W200" value={newW.id}
                onChange={e=>setNewW({...newW,id:e.target.value})} autoCapitalize="characters" />
            </div>
            <div>
              <label className="label">Full Name</label>
              <input className="input" placeholder="First Last" value={newW.name}
                onChange={e=>setNewW({...newW,name:e.target.value})} />
            </div>
          </div>
          <div className="grid-2 mb-4">
            <div>
              <label className="label">PIN</label>
              <input className="input mono" placeholder="1234" maxLength={6} value={newW.pin}
                onChange={e=>setNewW({...newW,pin:e.target.value})} inputMode="numeric" />
            </div>
            <div>
              <label className="label">Primary Line</label>
              <select className="select" value={newW.primaryLine}
                onChange={e=>setNewW({...newW,primaryLine:e.target.value})}>
                {lines.map(l=><option key={l.id} value={l.id}>{l.name}</option>)}
              </select>
            </div>
          </div>
          <div className="mb-4">
            <label className="label">Skills (comma-separated)</label>
            <input className="input" placeholder="e.g. Carton Packer, QC, Inspector"
              value={newW.skillsRaw} onChange={e=>setNewW({...newW,skillsRaw:e.target.value})} />
            <div style={{marginTop:4,fontSize:11,color:'var(--ink-3)'}}>
              Use exact role names so the system auto-suggests this worker when assigning shifts.
            </div>
          </div>
          {addErr && <div className="alert mb-4"><span className="alert-mark">!</span><div>{addErr}</div></div>}
          <button className="btn btn-accent" onClick={addWorker} disabled={addBusy||!newW.id||!newW.name}>
            {addBusy ? 'Adding…' : 'Add worker →'}
          </button>
        </div>
      )}

      <div className="stats">
        {lines.map(l => (
          <div key={l.id} className="stat" onClick={()=>setLineFilter(lineFilter===l.id?'':l.id)}
            style={{cursor:'pointer',background:lineFilter===l.id?'var(--paper-2)':'var(--paper)'}}>
            <div className="stat-eyebrow">{l.name}</div>
            <div className="stat-num">{byLine[l.id]||0}</div>
            <div className="stat-meta">{l.description}</div>
          </div>
        ))}
      </div>

      <div className="card mb-4">
        <div className="flex gap-3 items-center">
          <input className="input" placeholder="Search by name or ID…" value={filter}
            onChange={e=>setFilter(e.target.value)} style={{maxWidth:360}} />

      <div className="card" style={{padding:0}}>
        <table className="tbl">
          <thead>
            <tr>
              <th>ID</th>

}
function ManagerTimeOff() {
  const { user } = useAuth();
  const [entries, setEntries] = useState([]);
  const [users, setUsers]   = useState([]);
  const [workerId, setWorkerId] = useState('');
  const [date, setDate]     = useState('');
  const [type, setType]     = useState('RDO');
  const [note, setNote]     = useState('');
  const [busy, setBusy]     = useState(false);
  const [toast, setToast]   = useState('');
  const [filterWorker, setFilterWorker] = useState('');

  const refresh = async () => {
    const rdos  = await listRdoRequests();
    const usrs  = (await Store.get('users')) || [];
    setEntries(rdos);
    setUsers(usrs.filter(u => u.role !== 'manager'));
  };
  useEffect(() => { refresh(); }, []);

  const assign = async (e) => {
    e.preventDefault();
    if (!workerId || !date) return;
    setBusy(true);
    await assignRdo({ workerId, date, type, note, assignedBy: user.id });
    await refresh();
    setWorkerId(''); setDate(''); setType('RDO'); setNote('');
    setToast('Time off assigned.');
    setTimeout(() => setToast(''), 2500);
    setBusy(false);
  };

  const remove = async (id) => {
    if (!confirm('Remove this time-off entry?')) return;
    await removeRdo(id);
    await refresh();
  };

  const today = ymd(new Date());
  const findWorker = id => users.find(u => u.id === id);

  const visible = filterWorker
    ? entries.filter(r => r.workerId === filterWorker)
    : entries;

  // Sort by date desc
  const sorted = [...visible].sort((a,b) => b.date.localeCompare(a.date));

  return (
    <div className="fade-up">
      <div className="page-head">
        <div>
          <div className="page-eyebrow">Workforce · Leave management</div>
          <h1 className="page-title">Time Off</h1>
        </div>
      </div>

      {/* Assign form */}
      <div className="card mb-6">
        <div className="card-head">
          <div className="card-title">Assign time off</div>
        </div>
        <form onSubmit={assign}>
          <div className="grid-2 mb-4">
            <div>
              <label className="label">Worker</label>
              <select className="select" value={workerId} onChange={e=>setWorkerId(e.target.value)} required>
                <option value="">— Select worker —</option>
                {users.sort((a,b)=>a.name.localeCompare(b.name)).map(w =>
                  <option key={w.id} value={w.id}>{w.name} · {w.id}</option>
                )}
              </select>
            </div>
            <div>
              <label className="label">Date</label>
              <input type="date" className="input mono" value={date} min={today} onChange={e=>setDate(e.target.value)} required />
            </div>
          </div>
          <div className="grid-2 mb-4">
            <div>
              <label className="label">Type</label>
              <select className="select" value={type} onChange={e=>setType(e.target.value)}>
                <option value="RDO">RDO</option>
                <option value="Annual">Annual leave</option>
                <option value="Personal">Personal leave</option>
                <option value="Sick">Sick leave</option>
                <option value="TOIL">TOIL</option>
              </select>
            </div>
            <div>
              <label className="label">Note (optional)</label>
              <input className="input" value={note} onChange={e=>setNote(e.target.value)} placeholder="e.g. pre-approved, planned" />
            </div>
          </div>
          <div className="flex gap-2 items-center">
            <button className="btn btn-accent" type="submit" disabled={busy || !workerId || !date}>
              {busy ? 'Saving…' : 'Assign →'}
            </button>
            {toast && <span className="text-sm" style={{color:'var(--confirm)'}}>✓ {toast}</span>}
          </div>
        </form>
      </div>

      {/* Filter + list */}
      <div className="flex gap-3 items-center mb-4 flex-wrap">
        <div className="page-eyebrow" style={{marginBottom:0}}>{sorted.length} entr{sorted.length===1?'y':'ies'}</div>
        <select className="select" value={filterWorker} onChange={e=>setFilterWorker(e.target.value)} style={{maxWidth:240}}>
          <option value="">All workers</option>
          {users.sort((a,b)=>a.name.localeCompare(b.name)).map(w =>
            <option key={w.id} value={w.id}>{w.name}</option>
          )}
        </select>
        {filterWorker && <button className="btn btn-sm btn-ghost" onClick={()=>setFilterWorker('')}>clear</button>}
      </div>

      {sorted.length === 0 ? (
        <div className="empty-state">No time-off entries yet.</div>
      ) : sorted.map(r => {
        const w = findWorker(r.workerId);
        const d = new Date(r.date + 'T00:00:00');
        const assigner = users.find(u => u.id === r.assignedBy);
        return (
          <div key={r.id} className="tof-card approved">
            <div className="tof-date-block">
              <div className="tof-date-name">{DAY_NAMES[d.getDay()]}</div>
              <div className="tof-date-num">{d.getDate()}</div>
              <div className="tof-date-month">{MONTHS[d.getMonth()]} {d.getFullYear()}</div>
            </div>
            <div>
              <div className="tof-meta">{r.type} · {w?.id || r.workerId} · {relativeTime(r.assignedAt)}</div>
              <div className="tof-name">{w?.name || r.workerId}</div>
              {r.note && <div className="tof-note">"{r.note}"</div>}
              <div style={{fontSize:11,color:'var(--ink-3)',marginTop:4}}>Assigned by {assigner?.name || r.assignedBy}</div>
            </div>
            <div className="tof-actions">
              <button className="btn btn-sm btn-ghost" style={{borderColor:'var(--accent)',color:'var(--accent)'}} onClick={()=>remove(r.id)}>Remove</button>

}

function PrintView() {
  const [weekStart, setWeekStart] = useState(() => startOfWeek(new Date()));
  const [roster, setRoster] = useState(null);
  const [users, setUsers] = useState([]);
  const [lines, setLines] = useState([]);
  const [products, setProducts] = useState([]);
  const [rdoRequests, setRdoRequests] = useState([]);
  const [showTimes, setShowTimes] = useState(true);
  const [showEmpty, setShowEmpty] = useState(true);
  const [showSummary, setShowSummary] = useState(true);
  const [compactMode, setCompactMode] = useState(false);
  const printRef = useRef(null);

  const load = useCallback(async () => {
    const [u, l, p, rdo] = await Promise.all([
      Store.get('users'), Store.get('lines'), Store.get('products'), Store.get('rdoRequests')
    ]);
    setUsers(u || []); setLines(l || []); setProducts(p || []); setRdoRequests(rdo || []);
    const r = await Store.get(`roster:${isoWeekKey(weekStart)}`);
    setRoster(r);
  }, [weekStart]);

  useEffect(() => { load(); }, [load]);

  const workersById = useMemo(() => {
    const m = {}; (users||[]).forEach(u => { m[u.id] = u; }); return m;
  }, [users]);

  // Build conflict map (same logic as roster grid)
  const conflictMap = useMemo(() => {
    if (!roster) return {};
    const c = {};
    const byDayWorker = {};
    roster.shifts.forEach(s => {
      if (!s.workerId) return;
      const k = `${s.day}_${s.workerId}`;
      (byDayWorker[k] = byDayWorker[k] || []).push(s);
    });
    Object.values(byDayWorker).forEach(arr => {
      if (arr.length < 2) return;
      for (let i=0;i<arr.length;i++) for (let j=i+1;j<arr.length;j++){
        const a=arr[i],b=arr[j];
        if (timeToDec(a.startTime)<timeToDec(b.endTime) && timeToDec(b.startTime)<timeToDec(a.endTime)){
          c[a.id]=true; c[b.id]=true;
        }
      }
    });
    // RDO conflicts
    const ws2 = new Date(roster.weekStart + 'T00:00:00');
    const rdoMap = {};
    rdoRequests.forEach(r => { rdoMap[`${r.workerId}_${r.date}`] = true; });
    roster.shifts.forEach(s => {
      if (s.workerId && rdoMap[`${s.workerId}_${ymd(addDays(ws2, s.day))}`]) c[s.id] = 'rdo';
    });
    return c;
  }, [roster, rdoRequests]);

  const doPrint = () => window.print();

  if (!lines.length) return <div className="empty-state">Loading…</div>;

  // Organise shifts: line → day → [shifts]
  const grid = {};
  lines.forEach(l => { grid[l.id] = [[],[],[],[],[]]; });
  if (roster) {
    roster.shifts.forEach(s => {
      if (grid[s.lineId]) grid[s.lineId][s.day].push(s);
    });
  }

  const weekDays = [0,1,2,3,4].map(i => addDays(weekStart, i));
  const productName = id => products.find(p=>p.id===id)?.name || '';

  // Summary stats per line
  const lineSummary = lines.map(l => {
    const allShifts = (grid[l.id]||[]).flat();
    return {
      id: l.id, name: l.name,
      total: allShifts.length,
      filled: allShifts.filter(s=>s.workerId).length,
    };
  });
  const grandTotal = lineSummary.reduce((a,b)=>a+b.total,0);
  const grandFilled = lineSummary.reduce((a,b)=>a+b.filled,0);

  const now = new Date();
  const printedAt = `${fmtFullDate(now)}, ${now.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}`;
  const weekLabel = `${fmtDate(weekStart)} – ${fmtDate(addDays(weekStart,4))} ${weekStart.getFullYear()}`;

  return (
    <div className="fade-up">
      {/* Screen-only controls — hidden on print */}
      <div className="pv-controls">
        <div>
          <div className="page-eyebrow">Print · Week of {weekLabel}</div>
          <h1 className="page-title" style={{fontSize:36}}>Print View</h1>
          {roster && (
            <div className="flex gap-2 items-center mt-2">
              <span className={`pill ${roster.status==='published'?'published':'draft'}`}>{roster.status}</span>
              {roster.version > 0 && <span className="text-xs muted">v{roster.version}</span>}
              {roster.status !== 'published' && (
                <span className="text-xs" style={{color:'var(--warn)'}}>⚠ Draft — publish before distributing</span>
              )}
            </div>
          )}
        </div>
        <div className="flex gap-3 items-center flex-wrap">
          <div className="pv-week-nav">
            <button className="btn btn-sm" onClick={()=>setWeekStart(addDays(weekStart,-7))}>← Prev</button>
            <button className="btn btn-sm" onClick={()=>setWeekStart(startOfWeek(new Date()))}>This Week</button>
            <button className="btn btn-sm" onClick={()=>setWeekStart(addDays(weekStart,7))}>Next →</button>
          </div>
          <div style={{width:1,height:24,background:'var(--rule-soft)'}}></div>
          <div className="pv-options">
            {[
              [showTimes,   setShowTimes,   'Times'],
              [showEmpty,   setShowEmpty,   'Empty slots'],
              [showSummary, setShowSummary, 'Summary'],
              [compactMode, setCompactMode, 'Compact'],
            ].map(([val, set, label]) => (
              <label key={label} style={{display:'flex',alignItems:'center',gap:6,fontSize:12,cursor:'pointer',userSelect:'none'}}>
                <input type="checkbox" checked={val} onChange={e=>set(e.target.checked)} style={{accentColor:'var(--ink)'}} />
                {label}
              </label>
            ))}
          </div>
          <div style={{width:1,height:24,background:'var(--rule-soft)'}}></div>
          <button className="btn btn-accent" onClick={doPrint} style={{gap:8}}>
            <span>⎙</span> Print / Save PDF
          </button>
        </div>
      </div>

      {!roster ? (
        <div className="empty-state">No roster for this week. Go to Weekly Roster to build one.</div>
      ) : (
        <div ref={printRef} className="pv-sheet" id="print-sheet">
          {/* Sheet header */}
          <div className="pv-header">
            <div>
              <div className="pv-title">Weekly Production Roster</div>
              <div className="pv-subtitle">Week of {weekLabel}</div>
            </div>
            <div className="pv-meta">
              <div>Status: {roster.status.toUpperCase()} · v{roster.version}</div>
              <div>Filled: {grandFilled} / {grandTotal} shifts</div>
              <div>Printed: {printedAt}</div>
              <div style={{marginTop:4,fontFamily:"'Instrument Serif',serif",fontSize:13,letterSpacing:0,textTransform:'none'}}>Shiftline</div>
            </div>
          </div>

          {/* Main roster table */}
          <table className="pt">
            <colgroup>
              <col style={{width: compactMode ? '90px' : '110px'}} />
              {weekDays.map((_,i) => <col key={i} />)}
            </colgroup>
            <thead>
              <tr>
                <th className="pt-line-head" style={{background:'#1a1614',color:'#f5f1ea',fontSize:9,fontFamily:"'IBM Plex Mono',monospace",textTransform:'uppercase',letterSpacing:'.12em',padding:'6px 8px',verticalAlign:'middle'}}>
                  Line / Day
                </th>
                {weekDays.map((d,i) => (
                  <th key={i} className="pt-day-head">
                    <span className="pt-date">{d.getDate()}</span>
                    {DAY_NAMES[d.getDay()].toUpperCase()}
                    <span style={{display:'block',fontSize:7.5,marginTop:1,opacity:.7}}>{MONTHS[d.getMonth()]}</span>
                  </th>
                ))}
              </tr>
            </thead>
            <tbody>
              {lines.map((line, li) => {
                // collect all shifts for this line across the week so we know max rows
                const maxSlots = Math.max(1, ...([0,1,2,3,4].map(d => grid[line.id][d].length)));

                return (
                  <tr key={line.id}>
                    {/* Line header cell */}
                    <td className="pt-line-head">
                      <div className="pt-line-name">{line.name}</div>
                      {/* Show today's product for first day as reference */}
                      {(() => {
                        const prod = grid[line.id][0][0]?.productId;
                        return prod ? <div className="pt-line-prod">{productName(prod)}</div> : null;
                      })()}
                      <div style={{marginTop:4,fontFamily:"'IBM Plex Mono',monospace",fontSize:7.5,color:'#7a7068',textTransform:'uppercase',letterSpacing:'.08em'}}>
                        {SHIFT_DEFAULTS[line.id]?.start}–{SHIFT_DEFAULTS[line.id]?.end}
                      </div>
                    </td>

                    {/* Day cells */}
                    {[0,1,2,3,4].map((dayIdx, di) => {
                      const dayShifts = [...grid[line.id][dayIdx]].sort((a,b) => {
                        // Leading Hand first, then by role alphabetically
                        if (a.role.includes('Leading Hand') && !b.role.includes('Leading Hand')) return -1;
                        if (!a.role.includes('Leading Hand') && b.role.includes('Leading Hand')) return 1;
                        return a.role.localeCompare(b.role);
                      });
                      const alt = (li + di) % 2 === 0;

                      return (
                        <td key={dayIdx} className={`pt-cell${alt?' alt':''}`}>
                          {/* Product label if different from line default */}
                          {(() => {
                            const prod = dayShifts[0]?.productId;
                            const lineProd = grid[line.id][0][0]?.productId;
                            if (prod && prod !== lineProd) {
                              return <div style={{fontSize:7.5,color:'#7a7068',fontStyle:'italic',marginBottom:3,paddingBottom:2,borderBottom:'1px dashed #ddd5c4'}}>{productName(prod)}</div>;
                            }
                            return null;
                          })()}

                          {dayShifts.length === 0 ? (
                            showEmpty && <div style={{fontSize:8,color:'#ccc',fontStyle:'italic',padding:'2px 0'}}>—</div>
                          ) : dayShifts.map(s => {
                            const w = s.workerId ? workersById[s.workerId] : null;
                            const ck = conflictMap[s.id];
                            const slotClass = `pt-slot ${w ? 'filled' : 'empty'} ${ck===true?'conflict':''} ${ck==='rdo'?'rdo':''}`;
                            if (!showEmpty && !w) return null;
                            return (
                              <div key={s.id} className={slotClass} style={compactMode?{marginBottom:1}:{}}>
                                {!compactMode && <div className="pt-role">{s.role}</div>}
                                <div className={`pt-worker${!w?' empty':''}`}>
                                  {w ? (compactMode ? w.name.split(' ')[0] : w.name) : (compactMode ? '—' : '— open —')}
                                </div>
                                {showTimes && !compactMode && (
                                  <div className="pt-time">{s.startTime}–{s.endTime}</div>
                                )}
                              </div>
                            );
                          })}
                        </td>
                      );
                    })}
                  </tr>
                );
              })}
            </tbody>
          </table>

          {/* Summary strip */}
          {showSummary && (
            <div className="pt-summary" style={{marginTop:16}}>
              {lineSummary.map(ls => (
                <div key={ls.id} className="pt-sum-cell">
                  <div className="pt-sum-line">{ls.name}</div>
                  <div className="pt-sum-num">{ls.filled}<span style={{fontSize:8,fontWeight:400,color:'#7a7068'}}>/{ls.total}</span></div>
                  <div className="pt-sum-label">filled</div>
                </div>
              ))}
              <div className="pt-sum-cell" style={{background:'#1a1614',color:'#f5f1ea'}}>
                <div className="pt-sum-line" style={{color:'#f5f1ea'}}>Total</div>
                <div className="pt-sum-num" style={{color:'#f5f1ea'}}>{grandFilled}<span style={{fontSize:8,fontWeight:400,color:'rgba(245,241,234,.6)'}}>/{grandTotal}</span></div>
                <div className="pt-sum-label" style={{color:'rgba(245,241,234,.6)'}}>{grandTotal?Math.round(grandFilled/grandTotal*100):0}% filled</div>
              </div>
            </div>
          )}

          {/* Footer */}
          <div className="pt-footer">
            <div className="pt-legend">
              <span><span className="pt-legend-dot" style={{background:'#1a1614'}}></span>Assigned</span>
              <span><span className="pt-legend-dot" style={{background:'#ddd5c4'}}></span>Open</span>
              <span><span className="pt-legend-dot" style={{background:'#dc4a2a'}}></span>Conflict</span>
              <span><span className="pt-legend-dot" style={{background:'#b8860b'}}></span>RDO</span>
            </div>
            <div>Shiftline · Confidential · Do not distribute outside the facility</div>
          </div>
        </div>
      )}
    </div>
  );
}

  const [roster, setRoster] = useState(null);
  const [lines, setLines] = useState([]);
  const [products, setProducts] = useState([]);
  const [rdoRequests, setRdoRequests] = useState([]);
  const [unreadNotif, setUnreadNotif] = useState(0);
  const weekStart = startOfWeek(new Date());

  useEffect(() => {(async () => {
    const r = await Store.get(`roster:${isoWeekKey(weekStart)}`);
    setRoster(r);
    setLines((await Store.get('lines')) || []);
    setProducts((await Store.get('products')) || []);
    const all = (await Store.get('rdoRequests')) || [];
    setRdoRequests(all.filter(req => req.workerId === user.id));
    const n = (await Store.get(`notif:${user.id}`)) || [];
    setUnreadNotif(n.filter(x=>x.unread).length);
  })();}, [user.id]);

  if (!roster || roster.status!=='published') {
    return (
      <div className="fade-up">
        <div className="w-hero">
          <div>
            <div className="page-eyebrow">Hello,</div>
            <h1 className="w-hello">{user.name.split(' ')[0]}</h1>
            <div className="w-meta">Week of {fmtFullDate(weekStart)}</div>
          </div>
        </div>
        <div className="empty-state">No published roster for this week yet. Your manager will publish it shortly.</div>
      </div>
    );
  }

  const myShifts = roster.shifts.filter(s => s.workerId === user.id).sort((a,b) => a.day - b.day || a.startTime.localeCompare(b.startTime));
  const totalHours = myShifts.reduce((sum,s) => sum + parseFloat(durationHours(s.startTime, s.endTime)), 0).toFixed(1);
  const daysWorked = new Set(myShifts.map(s=>s.day)).size;

  // All stored RDOs are assigned — just index by date
  const rdoByDate = {};
  rdoRequests.forEach(r => { rdoByDate[r.date] = r; });

  const weekDays = [0,1,2,3,4].map(i => {
    const d = addDays(weekStart, i);
    const shifts = myShifts.filter(s => s.day === i);
    const rdo = rdoByDate[ymd(d)];
    return { dayIdx:i, date:d, shifts, rdo };
  });

  return (
    <div className="fade-up">
      <div className="w-hero">
        <div>
          <div className="page-eyebrow">Hello,</div>
          <h1 className="w-hello">{user.name.split(' ')[0]}<em>.</em></h1>
          <div className="w-meta">Week of {fmtFullDate(weekStart)} · {myShifts.length} shift{myShifts.length!==1?'s':''} · {totalHours}h scheduled</div>
        </div>
        {unreadNotif > 0 && (
          <button className="btn btn-accent" onClick={onGoNotifs}>
            {unreadNotif} new notification{unreadNotif!==1?'s':''} →
          </button>
        )}
      </div>

      <div className="stats">
        <div className="stat">
          <div className="stat-eyebrow">Days On</div>
          <div className="stat-num">{daysWorked}</div>
          <div className="stat-meta">of 5 weekdays</div>
        </div>
        <div className="stat">
          <div className="stat-eyebrow">Days Off</div>
          <div className="stat-num">{5 - daysWorked}</div>
          <div className="stat-meta">RDOs / unscheduled</div>
        </div>
        <div className="stat">
          <div className="stat-eyebrow">Total Hours</div>
          <div className="stat-num">{totalHours}</div>
          <div className="stat-meta">across the week</div>
        </div>
        <div className="stat">
          <div className="stat-eyebrow">Roster Version</div>
          <div className="stat-num">v{roster.version}</div>
          <div className="stat-meta">published {roster.publishedAt ? new Date(roster.publishedAt).toLocaleDateString() : '—'}</div>
        </div>
      </div>

      <div>
        <div className="page-eyebrow mb-3">Your week</div>
        {weekDays.map(({dayIdx, date, shifts, rdo}) => {
          if (rdo) {
            return (
              <div key={dayIdx} className="w-day-rdo">
                <div className="w-day-block">
                  <div className="w-day-name">{DAY_NAMES[date.getDay()]}</div>
                  <div className="w-day-num">{date.getDate()}</div>
                  <div className="w-day-month">{MONTHS[date.getMonth()]}</div>
                </div>
                <div>
                  <div className="w-day-rdo-label">{rdo.type}</div>
                  <div className="w-day-rdo-sub">Time off{rdo.note ? ` · ${rdo.note}` : ''}</div>
                </div>
              </div>
            );
          }
          if (shifts.length === 0) {
            return (
              <div key={dayIdx} className="w-day-off">
                <div className="w-day-block">
                  <div className="w-day-name">{DAY_NAMES[date.getDay()]}</div>
                  <div className="w-day-num">{date.getDate()}</div>
                  <div className="w-day-month">{MONTHS[date.getMonth()]}</div>
                </div>
                <div className="w-day-off-label">Day off</div>
              </div>
            );
          }
          return shifts.map((s,i) => {
            const line = lines.find(l => l.id === s.lineId);
            const product = products.find(p => p.id === s.productId);
            return (
              <div key={s.id} className="w-shift-card">
                {i === 0 ? (
                  <div className="w-day-block">
                    <div className="w-day-name">{DAY_NAMES[date.getDay()]}</div>
                    <div className="w-day-num">{date.getDate()}</div>
                    <div className="w-day-month">{MONTHS[date.getMonth()]}</div>
                  </div>
                ) : <div></div>}
                <div className="w-shift-body">
                  <div className="w-shift-role">{s.role}</div>
                  <div className="w-shift-line">on {line?.name || s.lineId}</div>
                  {product && <div className="w-shift-prod">{product.name}</div>}
                </div>
                <div>
                  <div className="w-shift-time">{s.startTime} <span style={{color:'var(--ink-3)'}}>→</span> {s.endTime}</div>
                  <div className="w-shift-time-sm">{durationHours(s.startTime, s.endTime)} hours</div>
                </div>
              </div>
            );
          });
        })}
      </div>
    </div>
  );
}

function WorkerSchedule() {
  const { user } = useAuth();
  const [weekStart, setWeekStart] = useState(() => startOfWeek(new Date()));
  const [roster, setRoster] = useState(null);
  const [lines, setLines] = useState([]);
  const [products, setProducts] = useState([]);

  useEffect(() => {(async () => {
    setRoster(await Store.get(`roster:${isoWeekKey(weekStart)}`));
    setLines((await Store.get('lines')) || []);
    setProducts((await Store.get('products')) || []);
  })();}, [weekStart]);

  const myShifts = roster ? roster.shifts.filter(s => s.workerId === user.id) : [];

  return (
    <div className="fade-up">
      <div className="page-head">
        <div>
          <div className="page-eyebrow">Schedule · Week of {fmtFullDate(weekStart)}</div>
          <h1 className="page-title">Full Schedule</h1>
        </div>
        <div className="page-actions">
          <button className="btn btn-sm" onClick={()=>setWeekStart(addDays(weekStart,-7))}>← Prev Week</button>
          <button className="btn btn-sm" onClick={()=>setWeekStart(startOfWeek(new Date()))}>This Week</button>
          <button className="btn btn-sm" onClick={()=>setWeekStart(addDays(weekStart,7))}>Next Week →</button>
        </div>
      </div>

      {!roster || roster.status !== 'published' ? (
        <div className="empty-state">No published roster for this week.</div>
      ) : myShifts.length === 0 ? (
        <div className="empty-state">You have no shifts assigned this week. Enjoy the rest!</div>
      ) : (
        <div className="card" style={{padding:0}}>
          <table className="tbl">
            <thead>
              <tr>
                <th>Day</th><th>Date</th><th>Line</th><th>Product</th><th>Role</th><th>Start</th><th>End</th><th>Hours</th>
              </tr>
            </thead>
            <tbody>
              {myShifts.sort((a,b)=>a.day-b.day||a.startTime.localeCompare(b.startTime)).map(s => {
                const d = addDays(weekStart, s.day);
                return (
                  <tr key={s.id}>
                    <td><strong>{DAY_FULL[d.getDay()]}</strong></td>
                    <td className="mono">{fmtDate(d)}</td>
                    <td>{lines.find(l=>l.id===s.lineId)?.name}</td>
                    <td className="text-sm">{products.find(p=>p.id===s.productId)?.name || '—'}</td>
                    <td><strong>{s.role}</strong></td>
                    <td className="mono">{s.startTime}</td>
                    <td className="mono">{s.endTime}</td>
                    <td className="mono">{durationHours(s.startTime, s.endTime)}</td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      )}
    </div>
  );
}

function WorkerTimeOff() {
  const { user } = useAuth();
  const [entries, setEntries] = useState([]);

  useEffect(() => {(async () => {
    const all = await listRdoRequests();
    setEntries(all.filter(r => r.workerId === user.id).sort((a,b) => b.date.localeCompare(a.date)));
  })();}, [user.id]);

  return (
    <div className="fade-up">
      <div className="page-head">
        <div>
          <div className="page-eyebrow">Your schedule</div>
          <h1 className="page-title">Time Off</h1>
        </div>
      </div>
      <div className="alert confirm mb-4" style={{padding:'10px 16px'}}>
        <span className="alert-mark" style={{fontSize:12}}>i</span>
        <div style={{fontSize:12}}>Time off is assigned by your manager and will appear here automatically.</div>
      </div>
      {entries.length === 0 ? (
        <div className="empty-state">No time off assigned yet.</div>
      ) : entries.map(r => {
        const d = new Date(r.date + 'T00:00:00');
        return (
          <div key={r.id} className="tof-card approved">
            <div className="tof-date-block">
              <div className="tof-date-name">{DAY_NAMES[d.getDay()]}</div>
              <div className="tof-date-num">{d.getDate()}</div>
              <div className="tof-date-month">{MONTHS[d.getMonth()]} {d.getFullYear()}</div>
            </div>
            <div>
              <div className="tof-meta">{r.type} · {relativeTime(r.assignedAt)}</div>
              <div className="tof-name">Time off</div>
              {r.note && <div className="tof-note">"{r.note}"</div>}
            </div>
            <span className="pill published">assigned</span>
          </div>
        );
      })}
    </div>
  );
}

function WorkerNotifications({ onRead }) {
  const { user } = useAuth();
  const [items, setItems] = useState([]);
  const [busy, setBusy] = useState(false);

  const load = async () => {
    setItems((await Store.get(`notif:${user.id}`)) || []);
  };
  useEffect(() => { load(); }, []);

  const markAllRead = async () => {
    setBusy(true);
    const updated = items.map(n => ({...n, unread:false}));
    await Store.set(`notif:${user.id}`, updated);
    setItems(updated);
    onRead && onRead();
    setBusy(false);
  };

  const clearAll = async () => {
    if (!confirm('Clear all notifications?')) return;
    await Store.set(`notif:${user.id}`, []);
    setItems([]);
    onRead && onRead();
  };

  const unread = items.filter(n => n.unread).length;

  return (
    <div className="fade-up">
      <div className="page-head">
        <div>
          <div className="page-eyebrow">{unread} unread · {items.length} total</div>
          <h1 className="page-title">Notifications</h1>
        </div>
        <div className="page-actions">
          {unread > 0 && <button className="btn btn-sm" onClick={markAllRead} disabled={busy}>Mark all read</button>}
          {items.length > 0 && <button className="btn btn-sm btn-ghost" onClick={clearAll}>Clear all</button>}
        </div>
      </div>

      <div className="card">
        {items.length === 0 ? (
          <div className="empty-state">No notifications yet.</div>
        ) : items.map(n => (
          <div key={n.id} className={`notif ${n.unread?'unread':''}`}>
            <div className="notif-time">{relativeTime(n.ts)}</div>
            <div className="notif-body">
              <div><strong>{n.title}</strong></div>
              <div className="notif-summary">{n.summary}</div>
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

function relativeTime(ts) {
  const diff = Date.now() - ts;
  const m = Math.floor(diff/60000);
  if (m < 1) return 'just now';
  if (m < 60) return `${m}m ago`;
  const h = Math.floor(m/60);
  if (h < 24) return `${h}h ago`;
  const d = Math.floor(h/24);
  if (d < 7) return `${d}d ago`;
  return new Date(ts).toLocaleDateString();
}

   APP ROOT
   ============================================================ */
function App() {
  const { user, loading } = useAuth();
  if (loading) {
    return <div style={{minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center'}}>
      <div style={{textAlign:'center'}}>
        <div className="brand" style={{justifyContent:'center'}}>
          <span className="brand-mark"></span>
          <div className="brand-name">Shiftline</div>
        </div>
        <div className="brand-sub mt-3">Loading…</div>
      </div>
    </div>;
  }
  if (!user) return <LoginScreen />;
  if (user.role === 'manager') return <ManagerApp />;
  return <WorkerApp />;
}

// ErrorBoundary — catches any React render error and shows it visually
class ErrorBoundary extends React.Component {
  constructor(props) { super(props); this.state = { error: null }; }
  static getDerivedStateFromError(error) { return { error }; }
  componentDidCatch(error, info) {
    // Also push to the visual overlay
    var overlay = document.getElementById('__error_overlay__');
    var text = document.getElementById('__error_text__');
    if (overlay && text) {
      text.textContent = 'React render error:\n\n' + (error.message || String(error)) +
        '\n\nComponent stack:' + (info.componentStack || '') +
        '\n\nStack:\n' + (error.stack || '');
      overlay.style.display = 'block';
    }
  }
  render() {
    if (this.state.error) {
      return React.createElement('div', {
        style: { padding:30, fontFamily:'monospace', color:'#1a1614' }
      }, 'An error occurred. See overlay for details.');
    }
    return this.props.children;
  }
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(
  <ErrorBoundary>
    <AuthProvider><App /></AuthProvider>
  </ErrorBoundary>
);
</script>
