<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shiftline — Workforce Rostering</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=IBM+Plex+Sans:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js"></script>
<style>
:root{
  --paper:#f5f1ea;
  --paper-2:#ebe5d9;
  --paper-3:#ddd5c4;
  --ink:#1a1614;
  --ink-2:#4a423b;
  --ink-3:#7a7068;
  --rule:#1a1614;
  --rule-soft:#c4b9a3;
  --accent:#dc4a2a;
  --accent-deep:#a93617;
  --accent-soft:#f4d4c8;
  --confirm:#0d4f3c;
  --confirm-soft:#c8dcd2;
  --warn:#b8860b;
  --warn-soft:#f0e3b8;
  --shadow-1:0 1px 0 rgba(26,22,20,.08);
  --shadow-2:0 2px 16px rgba(26,22,20,.08);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{
  background:var(--paper);
  color:var(--ink);
  font-family:'IBM Plex Sans',sans-serif;
  font-size:14px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
}
body{
  min-height:100vh;
  background-image:
    radial-gradient(circle at 1px 1px,rgba(26,22,20,.04) 1px,transparent 0);
  background-size:18px 18px;
}
button{font-family:inherit;font-size:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
.serif{font-family:'Instrument Serif',serif;font-weight:400;letter-spacing:-.005em}
.mono{font-family:'IBM Plex Mono',monospace;font-feature-settings:'ss01' on}
.up{text-transform:uppercase;letter-spacing:.08em}

/* Top bar */
.topbar{
  position:sticky;top:0;z-index:50;
  background:var(--paper);
  border-bottom:1px solid var(--rule);
  padding:14px 28px;
  display:flex;align-items:center;justify-content:space-between;gap:24px;
}
.brand{display:flex;align-items:baseline;gap:10px}
.brand-mark{
  width:28px;height:28px;
  background:var(--ink);
  position:relative;
  display:inline-block;
}
.brand-mark::after{
  content:"";position:absolute;
  inset:6px 4px 6px 4px;
  background:var(--accent);
}
.brand-name{font-family:'Instrument Serif',serif;font-size:26px;line-height:1}
.brand-sub{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.15em}
.topbar-meta{display:flex;align-items:center;gap:18px;font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink-2);text-transform:uppercase;letter-spacing:.1em}

/* Buttons */
.btn{
  display:inline-flex;align-items:center;gap:8px;
  padding:9px 16px;
  border:1px solid var(--ink);
  background:var(--paper);
  font-size:12px;font-weight:500;
  text-transform:uppercase;letter-spacing:.08em;
  transition:all .12s ease;
  white-space:nowrap;
}
.btn:hover{background:var(--ink);color:var(--paper)}
.btn-primary{background:var(--ink);color:var(--paper)}
.btn-primary:hover{background:var(--accent);border-color:var(--accent);color:#fff}
.btn-accent{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn-accent:hover{background:var(--accent-deep);border-color:var(--accent-deep)}
.btn-ghost{border-color:transparent}
.btn-ghost:hover{background:var(--paper-2);color:var(--ink)}
.btn-sm{padding:5px 10px;font-size:10px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn:disabled:hover{background:var(--paper);color:var(--ink)}

/* Inputs */
.input,.select,.textarea{
  width:100%;
  padding:10px 12px;
  background:#fff;
  border:1px solid var(--rule-soft);
  border-radius:0;
  font-size:13px;
  outline:none;
  transition:border-color .1s;
}
.input:focus,.select:focus,.textarea:focus{border-color:var(--ink)}
.label{
  display:block;
  font-family:'IBM Plex Mono',monospace;
  font-size:10px;
  text-transform:uppercase;letter-spacing:.12em;
  color:var(--ink-2);
  margin-bottom:6px;
}

/* Sidebar layout */
.app{display:flex;min-height:calc(100vh - 57px)}
.sidebar{
  width:220px;
  border-right:1px solid var(--rule);
  padding:24px 0;
  background:var(--paper);
  flex-shrink:0;
}
.sidenav-section{padding:0 24px 12px;font-family:'IBM Plex Mono',monospace;font-size:10px;text-transform:uppercase;letter-spacing:.15em;color:var(--ink-3);margin-top:12px}
.sidenav-section:first-child{margin-top:0}
.sidenav-item{
  display:flex;align-items:center;gap:10px;
  padding:10px 24px;
  font-size:13px;
  border-left:3px solid transparent;
  transition:all .1s;
  text-align:left;
  width:100%;
}
.sidenav-item:hover{background:var(--paper-2)}
.sidenav-item.active{
  border-left-color:var(--accent);
  background:var(--paper-2);
  font-weight:500;
}
.sidenav-item .badge{
  margin-left:auto;
  background:var(--accent);
  color:#fff;
  font-family:'IBM Plex Mono',monospace;
  font-size:10px;
  padding:1px 6px;
  border-radius:0;
}
.main{flex:1;padding:32px 40px;min-width:0;overflow-x:auto}

/* Page header */
.page-head{
  display:flex;align-items:flex-end;justify-content:space-between;
  padding-bottom:20px;
  border-bottom:1px solid var(--rule);
  margin-bottom:28px;
  gap:24px;flex-wrap:wrap;
}
.page-title{font-family:'Instrument Serif',serif;font-size:48px;line-height:1;letter-spacing:-.01em}
.page-eyebrow{font-family:'IBM Plex Mono',monospace;font-size:10px;text-transform:uppercase;letter-spacing:.15em;color:var(--ink-3);margin-bottom:6px}
.page-actions{display:flex;gap:8px;flex-wrap:wrap}

/* Cards */
.card{
  background:var(--paper);
  border:1px solid var(--rule);
  padding:20px;
}
.card-tight{padding:14px 16px}
.card-head{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:12px;padding-bottom:10px;
  border-bottom:1px solid var(--rule-soft);
}
.card-title{font-family:'Instrument Serif',serif;font-size:22px;line-height:1}

/* Tables */
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{
  text-align:left;
  font-family:'IBM Plex Mono',monospace;
  font-size:10px;text-transform:uppercase;letter-spacing:.12em;
  color:var(--ink-2);
  padding:10px 12px;border-bottom:1px solid var(--rule);
  font-weight:500;background:var(--paper-2);
}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--rule-soft);vertical-align:top}
.tbl tr:hover td{background:var(--paper-2)}
.tbl tr.row-clickable{cursor:pointer}

/* Roster grid */
.roster{
  border:1px solid var(--rule);
  background:var(--paper);
  overflow:auto;
}
.roster-table{
  display:grid;
  grid-template-columns:200px repeat(5,minmax(180px,1fr));
  min-width:1200px;
}
.r-cell{
  border-right:1px solid var(--rule-soft);
  border-bottom:1px solid var(--rule-soft);
  padding:12px;
  background:var(--paper);
}
.r-cell:nth-child(6n){border-right:none}
.r-day{
  background:var(--ink);color:var(--paper);
  position:sticky;top:0;z-index:5;
  font-family:'IBM Plex Mono',monospace;
  text-transform:uppercase;letter-spacing:.1em;
  padding:10px 12px;font-size:11px;
}
.r-day .day-num{font-family:'Instrument Serif',serif;font-size:24px;line-height:1;text-transform:none;letter-spacing:0;color:var(--paper)}
.r-day .day-date{color:rgba(245,241,234,.6);font-size:10px;margin-top:2px;display:block}
.r-line-head{
  background:var(--paper-2);
  font-weight:600;font-size:13px;
  border-right:1px solid var(--rule);
  position:sticky;left:0;z-index:4;
  display:flex;flex-direction:column;justify-content:space-between;
}
.r-line-name{font-family:'Instrument Serif',serif;font-size:24px;line-height:1.1}
.r-line-meta{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.1em;margin-top:4px}
.r-line-prod{font-size:11px;color:var(--ink-2);margin-top:8px;font-style:italic}

.shift{
  border:1px solid var(--rule-soft);
  background:#fff;
  padding:8px 10px;
  margin-bottom:6px;
  font-size:12px;
  cursor:pointer;
  transition:all .1s;
  position:relative;
  text-align:left;width:100%;
  display:block;
}
.shift:last-child{margin-bottom:0}
.shift:hover{border-color:var(--ink);box-shadow:var(--shadow-1)}
.shift-role{font-weight:500;font-size:12px;display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.shift-role .count{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--ink-3)}
.shift-worker{font-size:13px;color:var(--ink);margin-top:2px}
.shift-worker.empty{color:var(--ink-3);font-style:italic}
.shift-time{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--ink-2);margin-top:3px;letter-spacing:.04em}
.shift.conflict{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}
.shift.understaffed{border-color:var(--warn);background:var(--warn-soft)}
.shift-flag{
  font-family:'IBM Plex Mono',monospace;
  font-size:9px;text-transform:uppercase;letter-spacing:.1em;
  background:var(--accent);color:#fff;
  padding:1px 5px;display:inline-block;
  position:absolute;top:-1px;right:-1px;
}
.shift-flag.new{background:var(--confirm)}
.shift-flag.upd{background:var(--accent)}
.shift-flag.cnc{background:var(--ink-3);text-decoration:line-through}

.line-add{
  width:100%;padding:6px;font-size:11px;
  border:1px dashed var(--rule-soft);background:transparent;
  color:var(--ink-3);text-align:center;
  font-family:'IBM Plex Mono',monospace;text-transform:uppercase;letter-spacing:.1em;
}
.line-add:hover{border-color:var(--ink);color:var(--ink);background:var(--paper-2)}

/* Modal */
.modal-overlay{
  position:fixed;inset:0;z-index:9999;
  background:rgba(26,22,20,.5);
  display:flex;align-items:center;justify-content:center;
  padding:20px;
  backdrop-filter:blur(2px);
}
.modal{
  background:var(--paper);
  border:1px solid var(--ink);
  width:100%;max-width:520px;
  max-height:90vh;overflow-y:auto;
  box-shadow:0 20px 60px rgba(0,0,0,.3);
}
.modal-head{
  padding:20px 24px;
  border-bottom:1px solid var(--rule);
  display:flex;align-items:center;justify-content:space-between;
}
.modal-title{font-family:'Instrument Serif',serif;font-size:28px;line-height:1}
.modal-body{padding:24px}
.modal-foot{
  padding:16px 24px;
  border-top:1px solid var(--rule);
  display:flex;justify-content:space-between;gap:8px;align-items:center;
}

/* Drag and drop */
.shift[draggable=true]{cursor:grab}
.shift[draggable=true]:active{cursor:grabbing}
.shift.is-dragging{opacity:.35;border-style:dashed;transform:scale(.97)}
.shift.drag-over{
  border-color:var(--accent)!important;
  background:var(--accent-soft)!important;
  transform:scale(1.03);
  box-shadow:0 0 0 2px var(--accent);
  transition:transform .08s ease,box-shadow .08s ease;
}
.r-cell.drag-target{
  background:rgba(220,74,42,.05);
  outline:2px dashed var(--accent);
  outline-offset:-4px;
}
.drag-ghost{
  position:fixed;top:-9999px;left:-9999px;
  background:var(--ink);color:var(--paper);
  padding:6px 12px;font-size:12px;font-family:'IBM Plex Sans',sans-serif;
  font-weight:500;border-radius:0;white-space:nowrap;
  pointer-events:none;z-index:10000;
}
.drop-hint{
  text-align:center;padding:8px;
  border:2px dashed var(--accent);
  background:var(--accent-soft);
  font-family:'IBM Plex Mono',monospace;font-size:10px;
  text-transform:uppercase;letter-spacing:.1em;color:var(--accent);
  margin-bottom:4px;
}

/* Conflict alert */
.alert{
  border:1px solid var(--accent);
  background:var(--accent-soft);
  padding:12px 16px;font-size:13px;
  display:flex;align-items:flex-start;gap:10px;
  margin-bottom:16px;
}
.alert .alert-mark{
  font-family:'IBM Plex Mono',monospace;
  background:var(--accent);color:#fff;
  width:22px;height:22px;display:flex;align-items:center;justify-content:center;
  font-size:13px;font-weight:600;flex-shrink:0;
}
.alert.confirm{border-color:var(--confirm);background:var(--confirm-soft)}
.alert.confirm .alert-mark{background:var(--confirm)}
.alert.warn{border-color:var(--warn);background:var(--warn-soft)}
.alert.warn .alert-mark{background:var(--warn)}

/* Stat tiles */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:1px;background:var(--rule);border:1px solid var(--rule);margin-bottom:24px}
.stat{background:var(--paper);padding:18px 20px}
.stat-eyebrow{font-family:'IBM Plex Mono',monospace;font-size:9px;text-transform:uppercase;letter-spacing:.15em;color:var(--ink-3);margin-bottom:6px}
.stat-num{font-family:'Instrument Serif',serif;font-size:42px;line-height:1}
.stat-meta{font-size:11px;color:var(--ink-2);margin-top:4px}

/* Worker portal */
.w-hero{
  border:1px solid var(--ink);
  background:var(--paper);
  padding:28px 32px;
  display:flex;align-items:flex-end;justify-content:space-between;gap:24px;
  margin-bottom:24px;
  position:relative;overflow:hidden;
}
.w-hero::before{
  content:"";position:absolute;
  right:-40px;bottom:-40px;
  width:200px;height:200px;
  background:var(--accent);
  transform:rotate(45deg);
  opacity:.08;
}
.w-hello{font-family:'Instrument Serif',serif;font-size:54px;line-height:.95;letter-spacing:-.01em}
.w-hello em{font-style:italic;color:var(--accent)}
.w-meta{font-family:'IBM Plex Mono',monospace;font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--ink-2);margin-top:8px}

.w-shift-card{
  border:1px solid var(--rule);
  background:var(--paper);
  display:grid;
  grid-template-columns:90px 1fr auto;
  gap:18px;
  padding:18px 20px;
  margin-bottom:10px;
  align-items:center;
}
.w-shift-card.changed{border-color:var(--accent);border-left-width:4px}
.w-shift-card.cancelled{opacity:.55}
.w-shift-card.cancelled .w-shift-role{text-decoration:line-through}
.w-shift-card.new-shift{border-color:var(--confirm);border-left-width:4px}
.w-day-block{
  display:flex;flex-direction:column;
  align-items:flex-start;
}
.w-day-name{font-family:'IBM Plex Mono',monospace;font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:var(--ink-3)}
.w-day-num{font-family:'Instrument Serif',serif;font-size:48px;line-height:1;letter-spacing:-.02em}
.w-day-month{font-family:'IBM Plex Mono',monospace;font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:var(--ink-3)}
.w-shift-body{min-width:0}
.w-shift-role{font-family:'Instrument Serif',serif;font-size:24px;line-height:1.1}
.w-shift-line{font-size:13px;color:var(--ink-2);margin-top:4px}
.w-shift-prod{font-size:12px;color:var(--ink-3);margin-top:2px;font-style:italic}
.w-shift-time{font-family:'IBM Plex Mono',monospace;font-size:14px;text-align:right;letter-spacing:.04em}
.w-shift-time-sm{font-size:10px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.1em;margin-top:3px}
.w-tag{
  font-family:'IBM Plex Mono',monospace;
  font-size:9px;text-transform:uppercase;letter-spacing:.12em;
  padding:2px 7px;display:inline-block;margin-bottom:6px;
}
.w-tag.new{background:var(--confirm);color:#fff}
.w-tag.upd{background:var(--accent);color:#fff}
.w-tag.cnc{background:var(--ink-3);color:#fff}

.w-day-off{
  border:1px dashed var(--rule-soft);
  background:transparent;padding:18px 20px;
  margin-bottom:10px;
  display:grid;grid-template-columns:90px 1fr;gap:18px;align-items:center;
  color:var(--ink-3);
}
.w-day-off .w-day-num{color:var(--ink-3)}
.w-day-off .w-day-off-label{font-family:'Instrument Serif',serif;font-size:22px;font-style:italic;color:var(--ink-3)}

/* Notifications */
.notif{
  border-bottom:1px solid var(--rule-soft);
  padding:14px 0;
  display:flex;gap:12px;
}
.notif:first-child{padding-top:0}
.notif.unread{border-left:3px solid var(--accent);padding-left:12px;margin-left:-15px}
.notif-time{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.1em;white-space:nowrap}
.notif-body{flex:1;font-size:13px}
.notif-summary{margin-top:4px;color:var(--ink-2);font-size:12px}

/* Login */
.login-screen{
  min-height:100vh;
  display:grid;grid-template-columns:1fr 1fr;
}
.login-art{
  background:var(--ink);color:var(--paper);
  padding:40px;
  display:flex;flex-direction:column;justify-content:space-between;
  position:relative;overflow:hidden;
}
.login-art::before{
  content:"";position:absolute;
  inset:0;
  background-image:linear-gradient(135deg,rgba(220,74,42,.15) 0%,transparent 50%);
}
.login-art-content{position:relative;z-index:1}
.login-headline{font-family:'Instrument Serif',serif;font-size:72px;line-height:.95;letter-spacing:-.015em;margin-top:60px}
.login-headline em{font-style:italic;color:var(--accent)}
.login-tagline{font-family:'IBM Plex Mono',monospace;font-size:11px;text-transform:uppercase;letter-spacing:.18em;opacity:.6;margin-top:24px;max-width:380px;line-height:1.6}
.login-foot{font-family:'IBM Plex Mono',monospace;font-size:10px;text-transform:uppercase;letter-spacing:.15em;opacity:.4;position:relative;z-index:1}
.login-form-wrap{padding:60px 80px;display:flex;flex-direction:column;justify-content:center;background:var(--paper)}
.login-form{max-width:360px;width:100%}
.login-eyebrow{font-family:'IBM Plex Mono',monospace;font-size:11px;text-transform:uppercase;letter-spacing:.15em;color:var(--ink-2);margin-bottom:8px}
.login-title{font-family:'Instrument Serif',serif;font-size:42px;line-height:1;margin-bottom:32px}
.login-hint{
  margin-top:24px;padding:14px;
  border:1px dashed var(--rule-soft);
  font-size:11px;color:var(--ink-2);
  font-family:'IBM Plex Mono',monospace;
  line-height:1.6;
}
.login-hint b{color:var(--ink);font-weight:500}

/* Misc */
.empty-state{
  padding:60px 20px;text-align:center;
  color:var(--ink-3);font-style:italic;
  font-family:'Instrument Serif',serif;font-size:20px;
}
.divider{height:1px;background:var(--rule);margin:24px 0}
.divider-soft{height:1px;background:var(--rule-soft);margin:16px 0}
.tab-row{display:flex;gap:0;border-bottom:1px solid var(--rule);margin-bottom:20px}
.tab{
  padding:10px 16px;font-size:12px;
  text-transform:uppercase;letter-spacing:.08em;
  border-bottom:2px solid transparent;margin-bottom:-1px;
  color:var(--ink-3);
}
.tab:hover{color:var(--ink)}
.tab.active{border-bottom-color:var(--accent);color:var(--ink);font-weight:500}

.pill{
  display:inline-block;padding:2px 8px;
  font-family:'IBM Plex Mono',monospace;
  font-size:10px;text-transform:uppercase;letter-spacing:.1em;
  border:1px solid var(--ink);
}
.pill.draft{border-color:var(--warn);color:var(--warn);background:var(--warn-soft)}
.pill.published{border-color:var(--confirm);color:var(--confirm);background:var(--confirm-soft)}
.pill.accent{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}

.skill-chip{
  display:inline-block;
  border:1px solid var(--rule-soft);
  background:var(--paper);
  padding:2px 8px;font-size:11px;
  margin:0 4px 4px 0;
  font-family:'IBM Plex Mono',monospace;
  letter-spacing:.04em;
}

.muted{color:var(--ink-3)}
.flex{display:flex}.gap-2{gap:8px}.gap-3{gap:12px}.gap-4{gap:16px}.items-center{align-items:center}.justify-between{justify-content:space-between}.flex-wrap{flex-wrap:wrap}.flex-1{flex:1}
.mb-2{margin-bottom:8px}.mb-3{margin-bottom:12px}.mb-4{margin-bottom:16px}.mb-6{margin-bottom:24px}
.mt-2{margin-top:8px}.mt-3{margin-top:12px}.mt-4{margin-top:16px}.mt-6{margin-top:24px}
.text-sm{font-size:12px}.text-xs{font-size:11px}

<div id="root">
  <!-- Pre-React fallback content. If scripts fail to load or React fails to mount,
       this stays visible and at least gives the user something useful. -->
  <div id="__bootstrap__" style="min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:'IBM Plex Sans',sans-serif">
    <div style="text-align:center;max-width:420px;padding:30px">
      <div style="font-family:'Instrument Serif',serif;font-size:36px;color:#1a1614">Shiftline</div>
      <div style="font-family:'IBM Plex Mono',monospace;font-size:11px;color:#7a7068;text-transform:uppercase;letter-spacing:.15em;margin-top:8px">Loading the application…</div>
      <div id="__bootstrap_msg__" style="margin-top:20px;font-size:12px;color:#7a7068"></div>
      <noscript style="display:block;margin-top:20px;color:#dc4a2a">JavaScript is required to run Shiftline.</noscript>
    </div>
  </div>
</div>
<div id="__error_overlay__" style="display:none;position:fixed;inset:0;background:#fff;z-index:99999;padding:24px;font-family:monospace;font-size:13px;line-height:1.5;color:#1a1614;overflow:auto">
  <h2 style="font-family:'Instrument Serif',serif;color:#dc4a2a;margin-bottom:12px">Something went wrong</h2>
  <p style="margin-bottom:12px;font-size:12px">Please copy this message and send it to your developer:</p>
  <pre id="__error_text__" style="background:#f5f1ea;padding:14px;border:1px solid #ddd5c4;white-space:pre-wrap;word-break:break-word;font-size:11px"></pre>
  <button onclick="document.getElementById('__error_overlay__').style.display='none';location.reload()" style="margin-top:14px;padding:8px 16px;background:#1a1614;color:#fff;border:none;cursor:pointer;font-family:inherit">Reload page</button>
</div>

<script>
// Diagnostic shim that runs BEFORE any other scripts. Catches CDN load failures
// and runtime errors before React boots so the user never sees a blank screen.
(function() {
  var msg = document.getElementById('__bootstrap_msg__');

  // Track CDN load progress
  var loadStart = Date.now();
  var checkLoad = setInterval(function() {
    if (window.React && window.ReactDOM && window.Babel) {
      msg.textContent = 'Scripts loaded · initialising…';
      clearInterval(checkLoad);
    } else if (Date.now() - loadStart > 12000) {
      // After 12s, scripts probably failed to load
      msg.innerHTML = '<span style="color:#dc4a2a">⚠ Could not load required scripts.</span><br>' +
        'This usually means your network blocks Cloudflare CDN.<br>' +
        '<span style="font-size:10px;opacity:.7">Try: open in another browser, disable extensions, or check internet.</span>';
      clearInterval(checkLoad);
    }
  }, 500);

  // Catch runtime errors and show them
  window.addEventListener('error', function(e) {
    var overlay = document.getElementById('__error_overlay__');
    var text = document.getElementById('__error_text__');
    if (overlay && text) {
      var detail = (e.message || 'Unknown error') + '\n\n';
      if (e.filename) detail += 'File: ' + e.filename + '\n';
      if (e.lineno) detail += 'Line: ' + e.lineno + ':' + (e.colno || 0) + '\n';
      if (e.error && e.error.stack) detail += '\n' + e.error.stack;
      text.textContent = detail;
      overlay.style.display = 'block';
    }
  });
  window.addEventListener('unhandledrejection', function(e) {
    var overlay = document.getElementById('__error_overlay__');
    var text = document.getElementById('__error_text__');
    if (overlay && text) {
      var r = e.reason || {};
      text.textContent = 'Unhandled promise rejection:\n\n' + (r.message || String(r)) + (r.stack ? '\n\n' + r.stack : '');
      overlay.style.display = 'block';
    }
  });
})();
</script>
<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo, useRef, useCallback, createContext, useContext } = React;

/* ============================================================
   STORAGE LAYER — memory-first, with optional persistence
   In-memory map is the source of truth during the session.
   We try to mirror to window.storage so data survives reload,
   but failures there don't break the app.
   ============================================================ */
// ── Supabase client ──────────────────────────────────────────
const SUPABASE_URL  = 'https://zqatducmyobthysrzvol.supabase.co';
const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpxYXRkdWNteW9idGh5c3J6dm9sIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg2NjQxMTIsImV4cCI6MjA5NDI0MDExMn0.WOnObAFFPch1owaq4bZ1TTOwGIpS8aiICm9NmDS7NNc';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

const Store = {
  _session: null,

  async get(key) {
    if (key === 'currentUser')   return Store._session;
    if (key === '_seeded')       return { version: 99 }; // DB is source of truth
    if (key === 'skuTemplates')  return SKU_POSITION_TEMPLATES; // kept in-code for now

    if (key === 'users') {
      const { data } = await sb.from('users').select('*');
      return (data || []).map(u => ({
        ...u, primaryLine: u.primary_line, role: u.role || 'worker',
        skills: u.skills || [],
      }));
    }
    if (key === 'lines') {
      const { data } = await sb.from('lines').select('*');
      return data || [];
    }
    if (key === 'products') {
      const { data } = await sb.from('products').select('*');
      return (data || []).map(p => ({ ...p, lineId: p.line_id }));
    }
    if (key === 'rdoRequests') {
      const { data } = await sb.from('rdo_requests').select('*');
      return (data || []).map(r => ({
        ...r, workerId: r.worker_id,
        assignedBy: r.assigned_by, assignedAt: new Date(r.assigned_at).getTime(),
      }));
    }
    if (key === 'roles') return ROLES;

    if (key.startsWith('roster:')) {
      const weekStart = key.replace('roster:', '');
      const { data: roster } = await sb.from('rosters')
        .select('*').eq('week_start', weekStart).maybeSingle();
      if (!roster) return null;
      const { data: shifts } = await sb.from('shifts')
        .select('*').eq('roster_id', roster.id);
      return {
        weekStart:   roster.week_start,
        status:      roster.status,
        publishedAt: roster.published_at ? new Date(roster.published_at).getTime() : null,
        version:     roster.version,
        changeLog:   roster.change_log || [],
        shifts: (shifts || []).map(s => ({
          id:        s.id,
          day:       s.day,
          lineId:    s.line_id,
          productId: s.product_id,
          role:      s.role,
          workerId:  s.worker_id,
          startTime: s.start_time,
          endTime:   s.end_time,
          stdCount:  s.std_count,
        })),
      };
    }

    if (key.startsWith('notif:')) {
      const workerId = key.replace('notif:', '');
      const { data } = await sb.from('notifications')
        .select('*').eq('worker_id', workerId)
        .order('created_at', { ascending: false }).limit(30);
      return (data || []).map(n => ({
        id:        n.id,
        ts:        new Date(n.created_at).getTime(),
        title:     n.title,
        summary:   n.summary,
        type:      n.type,
        unread:    n.unread,
        weekStart: n.week_start,
      }));
    }
    return null;
  },

  async set(key, value) {
    if (key === 'currentUser') { Store._session = value; return true; }
    if (key === '_seeded' || key === 'roles' || key === 'skuTemplates') return true;
    if (key === 'users' || key === 'lines' || key === 'products') return true; // managed via DB seed

    if (key === 'rdoRequests') return true; // handled individually via assignRdo/removeRdo

    if (key.startsWith('notif:')) return true; // notifications inserted individually

    if (key.startsWith('roster:')) {
      const { weekStart, status, publishedAt, version, changeLog, shifts } = value;
      const { data: roster, error: rErr } = await sb.from('rosters').upsert({
        week_start:   weekStart,
        status:       status,
        published_at: publishedAt ? new Date(publishedAt).toISOString() : null,
        version:      version || 0,
        change_log:   changeLog || [],
        updated_at:   new Date().toISOString(),
      }, { onConflict: 'week_start' }).select().single();

      if (rErr || !roster) { console.error('[Shiftline] roster upsert:', rErr); return false; }

      await sb.from('shifts').delete().eq('roster_id', roster.id);
      if (shifts && shifts.length > 0) {
        const { error: sErr } = await sb.from('shifts').insert(
          shifts.map(s => ({
            id:         s.id,
            roster_id:  roster.id,
            day:        s.day,
            line_id:    s.lineId,
            product_id: s.productId,
            role:       s.role,
            worker_id:  s.workerId || null,
            start_time: s.startTime,
            end_time:   s.endTime,
            std_count:  s.stdCount || 1,
          }))
        );
        if (sErr) console.error('[Shiftline] shifts insert:', sErr);
      }
      return true;
    }
    return true;
  },

  async del(key) {
    if (key === 'currentUser') { Store._session = null; return true; }
    return true;
  },

  getMode() { return 'supabase'; },
};

/* ============================================================
   DATE / TIME HELPERS
   ============================================================ */
const DAY_NAMES = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const DAY_FULL = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

function startOfWeek(date) {
  const d = new Date(date);
  const day = d.getDay();
  const diff = day === 0 ? -6 : 1 - day; // monday start
  d.setDate(d.getDate() + diff);
  d.setHours(0,0,0,0);
  return d;
}
function isoWeekKey(date) {
  const d = startOfWeek(date);
  return d.toISOString().slice(0,10);
}
function addDays(d, n) { const c = new Date(d); c.setDate(c.getDate()+n); return c; }
function fmtDate(d) { return `${d.getDate()} ${MONTHS[d.getMonth()]}`; }
function fmtFullDate(d) { return `${MONTHS[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()}`; }

// Excel decimal day (0.25=06:00) -> "HH:MM"
function decToTime(dec) {
  if (dec == null || isNaN(dec)) return '--:--';
  const total = Math.round(dec * 24 * 60);
  const h = Math.floor(total/60) % 24;
  const m = total % 60;
  return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;
}
function timeToDec(t) {
  if (!t) return null;
  const [h,m] = t.split(':').map(Number);
  return (h*60 + m) / (24*60);
}
function fmtTimeRange(s,e) { return `${s} → ${e}`; }
function durationHours(s,e) {
  const [sh,sm] = s.split(':').map(Number);
  const [eh,em] = e.split(':').map(Number);
  let mins = (eh*60+em) - (sh*60+sm);
  if (mins < 0) mins += 24*60;
  return (mins/60).toFixed(1);
}

function uuid() {
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
    const r = Math.random() * 16 | 0;
    return (c === 'x' ? r : (r & 0x3 | 0x8)).toString(16);
  });
}

// YYYY-MM-DD from a Date in local time
function ymd(d) {
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

/* ============================================================
   RDO / TIME-OFF HELPERS
   ============================================================ */
/* ============================================================
   RDO / TIME-OFF — manager assigns directly, no request flow
   ============================================================ */
async function listRdoRequests() {
  const { data } = await sb.from('rdo_requests').select('*').order('date', { ascending: true });
  return (data || []).map(r => ({
    ...r, workerId: r.worker_id,
    assignedBy: r.assigned_by, assignedAt: new Date(r.assigned_at).getTime(),
  }));
}
async function saveRdoRequests(arr) { /* no-op — use assignRdo/removeRdo */ }

async function assignRdo({ workerId, date, type='RDO', note='', assignedBy='' }) {
  // Upsert to Supabase (unique on worker_id+date)
  const { data: entry, error } = await sb.from('rdo_requests').upsert({
    worker_id:   workerId,
    date:        date,
    type:        type,
    note:        note,
    assigned_by: assignedBy,
    assigned_at: new Date().toISOString(),
  }, { onConflict: 'worker_id,date' }).select().single();
  if (error) { console.error('[Shiftline] assignRdo:', error); return null; }

  // Insert notification for this worker
  await sb.from('notifications').insert({
    worker_id: workerId, unread: true, type: 'rdo',
    title:   `Time off assigned — ${date}`,
    summary: `${type} recorded for ${date}${note ? `: "${note}"` : ''}.`,
  });

  // Broadcast live to worker if app is open
  await sb.channel(`notify:${workerId}`).send({
    type: 'broadcast', event: 'new_notification',
    payload: {
      id: entry.id, ts: Date.now(), unread: true, type: 'rdo',
      title:   `Time off assigned — ${date}`,
      summary: `${type} recorded for ${date}${note ? `: "${note}"` : ''}.`,
    },
  });

  return { ...entry, workerId: entry.worker_id };
}

async function removeRdo(id) {

/* ============================================================
   SaveStatus indicator — shows live save state inline
   ============================================================ */
function SaveStatus({ status }) {
  if (!status) return null;
  if (status.state === 'saving') {
    return <span className="text-xs muted" style={{display:'inline-flex',alignItems:'center',gap:6}}>
      <span style={{width:6,height:6,borderRadius:'50%',background:'var(--warn)',display:'inline-block',animation:'pulse 1s ease-in-out infinite'}}></span>
      saving…
    </span>;
  }
  if (status.state === 'error') {
    return <span className="text-xs" style={{color:'var(--accent)'}}>⚠ {status.error}</span>;
  }
  if (status.state === 'saved' && status.at) {
    return <span className="text-xs muted">✓ saved {relativeTime(status.at)}</span>;
  }
  if (status.state === 'idle' && status.at) {
    return <span className="text-xs muted">last saved {relativeTime(status.at)}</span>;
  }
  return null;
}

function buildSampleRoster(weekStart, status='draft') {
  const shifts = [];
  // Map products to lines per day to vary the week
  const productByLineByDay = {
    L1: ['P01','P03','P02','P05','P01'],
    L2: ['P10','P10','P10','P12','P10'],
    L4: ['P14','P15','P16','P17','P18'],
    RMI:['PRMI','PRMI','PRMI','PRMI','PRMI'],
    KLK:['PKLK','PKLK','PKLK','PKLK','PKLK'],
    CLN:['PCLN','PCLN','PCLN','PCLN','PCLN'],
    PLT:['PPLT','PPLT','PPLT','PPLT','PPLT'],
  };
  const workersByLine = {};
  SEED_WORKERS.forEach(w => {
    if (!workersByLine[w.primaryLine]) workersByLine[w.primaryLine] = [];
    workersByLine[w.primaryLine].push(w);
  });

  for (let dayIdx = 0; dayIdx < 5; dayIdx++) {
    Object.keys(SHIFT_TEMPLATES).forEach(lineId => {
      const tmpl = SHIFT_TEMPLATES[lineId];
      const productId = productByLineByDay[lineId][dayIdx];
      const def = SHIFT_DEFAULTS[lineId];
      const lineWorkers = [...(workersByLine[lineId] || [])];

      tmpl.forEach((slot, slotIdx) => {
        for (let i = 0; i < slot.count; i++) {
          // pick worker with matching skill
          let worker = null;
          const idx = lineWorkers.findIndex(w => w.skills.includes(slot.role));
          if (idx >= 0) {
            worker = lineWorkers[idx];
            lineWorkers.splice(idx,1);
          }
          shifts.push({
            id: uuid(),
            day: dayIdx,
            lineId,
            productId,
            role: slot.role,
            workerId: worker ? worker.id : null,
            startTime: def.start,
            endTime: def.end,
            stdCount: slot.count,
          });
        }
      });
    });
  }
  return {
    weekStart: isoWeekKey(weekStart),
    status,
    shifts,
    publishedAt: status==='published' ? Date.now() : null,
    version: 1,
    changeLog: [],
  };
}

/* ============================================================
   PORTAL — renders children directly into document.body so
   position:fixed always centres in the real viewport, not
   inside any overflow/transform ancestor.
   ============================================================ */
function Portal({ children }) {
  const el = useRef(document.createElement('div'));
  useEffect(() => {
    const node = el.current;
    document.body.appendChild(node);
    return () => document.body.removeChild(node);
  }, []);
  return ReactDOM.createPortal(children, el.current);
}

const AuthCtx = createContext(null);

function AuthProvider({ children }) {
  const [user, setUser] = useState(null);
  const [loading, setLoading] = useState(true);

  useEffect(() => { (async () => {
    await seedIfEmpty();
    const cur = Store._session;
    if (cur && cur.id) {
      const users = (await Store.get('users')) || [];
      const live = users.find(u => u.id === cur.id && u.role === cur.role);
      if (live) setUser(live);
      else Store._session = null;
    }
    setLoading(false);
  })(); }, []);

  const login = async (id, pin) => {
    const cleanId  = (id  || '').toUpperCase().trim();
    const cleanPin = (pin || '').trim();
    if (!cleanId || !cleanPin) return { ok:false, error:'Enter both your ID and PIN.' };

    const pinMatches = (stored, entered) => {
      const s = String(stored ?? '').trim();
      const p = String(entered ?? '').trim();
      if (!s || !p) return false;
      return s === p || s.padStart(4,'0') === p.padStart(4,'0');
    };

    // Look up from Supabase
    const users = (await Store.get('users')) || [];
    const u = users.find(x => x.id.toUpperCase() === cleanId && pinMatches(x.pin, cleanPin));
    if (u) {
      Store._session = u;
      setUser(u);
      return { ok:true };
    }

    const idMatch = users.find(x => x.id.toUpperCase() === cleanId);
    if (!idMatch) return { ok:false, error:`No account with ID "${cleanId}". Try ADMIN, M001, or W010.` };
    return { ok:false, error:`Wrong PIN for ${idMatch.name}. Managers use 0000 · Workers use 1234.` };
  };

  const logout = async () => {
    Store._session = null;
    setUser(null);
  };

  return <AuthCtx.Provider value={{ user, loading, login, logout, setUser }}>{children}</AuthCtx.Provider>;
}

const useAuth = () => useContext(AuthCtx);

/* ============================================================
   SKU TEMPLATES VIEW — manager view to inspect and customise
   position lists per product/SKU.
   ============================================================ */
function SKUTemplatesView() {
  const [products, setProducts] = useState([]);
  const [lines, setLines]       = useState([]);
  const [templates, setTemplates] = useState({});
  const [selectedPid, setSelectedPid] = useState(null);
  const [editPositions, setEditPositions] = useState([]);
  const [newRole, setNewRole]   = useState(ROLES[0]);
  const [newCount, setNewCount] = useState(1);
  const [toast, setToast]       = useState('');
  const [saving, setSaving]     = useState(false);
  const [dirty, setDirty]       = useState(false);

  const load = async () => {
    const p = (await Store.get('products')) || [];
    const l = (await Store.get('lines')) || [];
    const t = (await Store.get('skuTemplates')) || {};
    setProducts(p); setLines(l); setTemplates(t);
    if (!selectedPid && p.length) {
      const first = p.find(x => t[x.id]);
      if (first) { setSelectedPid(first.id); setEditPositions([...(t[first.id]?.positions || [])]); }
    }
  };
  useEffect(() => { load(); }, []);

  const selectProduct = (pid) => {
    if (dirty && !confirm('Discard unsaved changes?')) return;
    setSelectedPid(pid);
    setEditPositions([...(templates[pid]?.positions || [])]);
    setDirty(false);
  };

  const saveTemplate = async () => {
    if (!selectedPid) return;
    setSaving(true);
    const updated = { ...templates, [selectedPid]: { positions: editPositions } };
    await Store.set('skuTemplates', updated);
    setTemplates(updated);
    setSaving(false);
    setDirty(false);
    setToast('Template saved.');
    setTimeout(() => setToast(''), 2500);
  };

  const removePosition = (idx) => {
    setEditPositions(editPositions.filter((_, i) => i !== idx));
    setDirty(true);
  };

  const addPosition = () => {
    if (!newRole || newCount < 1) return;
    setEditPositions([...editPositions, { role: newRole, count: Number(newCount) }]);
    setNewRole(ROLES[0]);
    setNewCount(1);
    setDirty(true);
  };

  const updateCount = (idx, val) => {
    const n = Math.max(1, Number(val) || 1);
    setEditPositions(editPositions.map((p, i) => i === idx ? { ...p, count: n } : p));
    setDirty(true);
  };

  const movePosition = (idx, dir) => {
    const arr = [...editPositions];
    const swap = idx + dir;
    if (swap < 0 || swap >= arr.length) return;
    [arr[idx], arr[swap]] = [arr[swap], arr[idx]];
    setEditPositions(arr);
    setDirty(true);
  };

  const resetToDefault = () => {
    if (!selectedPid) return;
    if (!confirm('Reset to factory default? Any custom changes will be lost.')) return;
    const def = SKU_POSITION_TEMPLATES[selectedPid];
    setEditPositions(def ? [...def.positions] : []);
    setDirty(true);
  };

  const totalCount = editPositions.reduce((s, p) => s + p.count, 0);

  // Products that have a template (either custom or default)
  const productsByLine = {};
  lines.forEach(l => { productsByLine[l.id] = []; });
  products.forEach(p => {
    if (productsByLine[p.lineId]) productsByLine[p.lineId].push(p);
  });

  const selectedProduct = products.find(p => p.id === selectedPid);
  const selectedLine = selectedProduct ? lines.find(l => l.id === selectedProduct.lineId) : null;
  const hasDefault = selectedPid && !!SKU_POSITION_TEMPLATES[selectedPid];

  return (
    <div className="fade-up">
      <div className="page-head">
        <div>
          <div className="page-eyebrow">Configuration · Position mapping</div>
          <h1 className="page-title">SKU Templates</h1>
          <p style={{marginTop:6,color:'var(--ink-3)',fontSize:13}}>
            Define the required positions for each product/SKU. When applied to a roster cell, these generate the correct shift slots automatically.
          </p>
        </div>
      </div>

      {toast && <div className="alert confirm mb-4"><span className="alert-mark">✓</span><div>{toast}</div></div>}

      <div style={{display:'grid',gridTemplateColumns:'260px 1fr',gap:24,alignItems:'start'}}>
        {/* ── Product list panel ── */}
        <div style={{border:'1px solid var(--rule-soft)',background:'var(--paper)'}}>
          <div style={{padding:'10px 14px',borderBottom:'1px solid var(--rule-soft)',fontSize:10,fontFamily:"'IBM Plex Mono',monospace",textTransform:'uppercase',letterSpacing:'.1em',color:'var(--ink-3)'}}>
            Products
          </div>
          {lines.map(line => {
            const lineProds = productsByLine[line.id] || [];
            if (!lineProds.length) return null;
            return (
              <div key={line.id}>
                <div style={{padding:'6px 14px',fontSize:9,fontFamily:"'IBM Plex Mono',monospace",textTransform:'uppercase',letterSpacing:'.1em',color:'var(--ink-3)',background:'var(--paper-2)',borderBottom:'1px solid var(--rule-soft)'}}>
                  {line.name}
                </div>
                {lineProds.map(p => {
                  const hasTmpl = !!(templates[p.id]?.positions?.length);
                  const isCustom = hasTmpl && JSON.stringify(templates[p.id]?.positions) !== JSON.stringify(SKU_POSITION_TEMPLATES[p.id]?.positions);
                  return (
                    <button
                      key={p.id}

                        display:'block',width:'100%',textAlign:'left',

                  </select>
                </div>
                <div style={{flex:'0 0 70px'}}>
                  <label className="label">Count</label>
                  <input type="number" className="input" min="1" max="20" value={newCount}
                    onChange={e=>setNewCount(Math.max(1,Number(e.target.value)||1))}
                    style={{fontFamily:"'IBM Plex Mono',monospace"}}
                  />
                </div>
                <button className="btn" onClick={addPosition} style={{marginBottom:0}}>+ Add position</button>
              </div>
            </div>

            {editPositions.length > 0 && (
              <div style={{marginTop:12,padding:'10px 14px',background:'var(--paper-2)',border:'1px solid var(--rule-soft)',fontSize:11,fontFamily:"'IBM Plex Mono',monospace",color:'var(--ink-3)'}}>
                Summary: {editPositions.map(p=>`${p.role}×${p.count}`).join(' · ')} = <strong style={{color:'var(--ink)'}}>{totalCount} positions</strong>
              </div>
            )}
          </div>
        ) : (
          <div className="empty-state">Select a product to view or edit its position template.</div>
        )}
      </div>
    </div>
  );
}
